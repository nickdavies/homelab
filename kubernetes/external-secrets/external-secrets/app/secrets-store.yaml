apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-connect
spec:
  # The pipelines namespaces read only homelab-pipelines, through
  # onepassword-pipelines in tenant-stores.yaml. pipelines-reconciler can
  # create ExternalSecrets, so without this nick-assistant-pipelines could
  # name this store and read any homelab-k8s item.
  # kubernetes.io/metadata.name is set by the API server, so no label anyone
  # writes can satisfy it.
  #
  # workspaces isn't excluded yet: its volsync ExternalSecrets
  # (templates/volsync) read the cluster-wide backup items from this store.
  conditions:
    - namespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: NotIn
            values: [pipelines, pipelines-agents]
  provider:
    onepassword:
      connectHost: http://onepassword-connect.external-secrets.svc.cluster.local:8080
      vaults:
        homelab-k8s: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-connect-token
            key: token
            namespace: external-secrets
