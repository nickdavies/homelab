---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app external-secrets-operator
  namespace: flux-system
spec:
  targetNamespace: external-secrets
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # The chart skips its ServiceMonitors when their CRD is missing at install
  # (serviceMonitor.renderMode: skipIfMissing), and never adds them later.
  dependsOn:
    - name: prometheus-operator-crds
  path: ./kubernetes/external-secrets/external-secrets-operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  interval: 30m
