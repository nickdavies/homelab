apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: external-secrets
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    installCRDs: true
    # Nothing here uses these kinds. Off, the controller ignores them and drops
    # the RBAC they need: PushSecret's write path into 1Password, and
    # ClusterExternalSecret's update/patch on namespaces and cluster-wide
    # ExternalSecret create/delete. The CRDs stay installed.
    processClusterExternalSecret: false
    processClusterGenerator: false
    processClusterPushSecret: false
    processPushSecret: false
    # Don't fold ESO kinds into the built-in view/edit/admin roles: a future
    # edit binding would silently grant reading any vault item through a
    # ClusterSecretStore. Readers that need these kinds list them by name
    # (workspace-ops-read, headlamp, kube-ops-mcp).
    rbac:
      aggregateToView: false
      aggregateToEdit: false
      aggregateToAdmin: false
    serviceMonitor:
      enabled: true
      interval: 1m
    webhook:
      serviceMonitor:
        enabled: true
        interval: 1m
    certController:
      serviceMonitor:
        enabled: true
        interval: 1m
