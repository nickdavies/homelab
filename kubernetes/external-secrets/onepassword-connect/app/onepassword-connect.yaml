apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: 1password-connect
spec:
  interval: 1m
  chart:
    spec:
      chart: connect
      version: 2.4.3
      sourceRef:
        kind: HelmRepository
        name: 1password-connect
        namespace: flux-system
  # The chart ships the OnePasswordItem CRD in crds/, which Helm installs once
  # and never upgrades.
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    connect:
      credentialsName: onepassword-connect-credentials
      serviceType: ClusterIP
