---
# Flux's own FluxInstance. Talos creates it at bootstrap (talos/patches/flux-operator.yaml)
# and never updates it again; this Kustomization takes it over so upgrades go through git.
# Never prune it: deleting the FluxInstance makes flux-operator uninstall Flux.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app flux-instance
  namespace: flux-system
spec:
  targetNamespace: flux-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
    annotations:
      kustomize.toolkit.fluxcd.io/prune: disabled
  path: ./kubernetes/apps/flux-system/flux-instance/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
