---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-controllers
spec:
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - helm-controller
          - image-automation-controller
          - image-reflector-controller
          - kustomize-controller
          - notification-controller
          - source-controller
  podMetricsEndpoints:
    - port: http-prom
---
# Exports flux_resource_info (Ready/suspended state of every Flux object).
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: flux-operator
  podMetricsEndpoints:
    - port: http-metrics
