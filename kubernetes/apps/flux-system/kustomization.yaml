---
# talos/bootstrap.sh installs flux-operator and the FluxInstance from these
# paths; from then on they are managed here. There is deliberately no namespace.yaml:
# flux-system must never be owned (and so prunable) by cluster-apps.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./flux-instance/ks.yaml
  - ./flux-operator/ks.yaml
  - ./monitoring/ks.yaml
