---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Same version as FLUX_OPERATOR_VERSION in talos/talosenv; Renovate moves both in one PR.
  # renovate: datasource=github-releases depName=controlplaneio-fluxcd/flux-operator
  - https://github.com/controlplaneio-fluxcd/flux-operator/releases/download/v0.23.0/install.yaml
patches:
  # install.yaml ships the namespace; flux-system must never be owned (and so
  # prunable) by anything but Talos.
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: flux-system
