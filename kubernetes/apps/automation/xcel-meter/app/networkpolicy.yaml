---
# xcel-meter polls the two Itron meters' local API and publishes to MQTT. It
# serves nothing, so all ingress is denied.
#
#   egress  1883   Mosquitto
#
# Scope: eth0 only. The meters are reached over the multus-not macvlan (net1,
# helmrelease.yaml), which bypasses NetworkPolicy; the net1-guard init
# container filters that interface instead.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: xcel-meter
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: xcel-meter
      app.kubernetes.io/controller: xcel-meter
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mosquitto
      ports:
        - { port: 1883, protocol: TCP }
