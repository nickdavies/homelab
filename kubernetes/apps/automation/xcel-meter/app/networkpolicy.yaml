---
# xcel-meter polls the two Itron meters' local API and publishes to MQTT. It
# serves nothing, so all ingress is denied.
#
#   egress  1883   Mosquitto
#           8081   the meters, on the not VLAN (192.168.30.0/24, the
#                  multus-not network in homeassistant/app/deployment.yaml).
#                  Their IPs stay in the secret; the rule is scoped by port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: xcel-meter
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: xcel-meter
      app.kubernetes.io/controller: xcel-meter
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mosquitto
      ports:
        - { port: 1883, protocol: TCP }
    - to:
        - ipBlock: { cidr: 192.168.30.0/24 }
      ports:
        - { port: 8081, protocol: TCP }
