---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: xcel-meter
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: xcel-meter-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Client cert whose LFDI is registered with Xcel for both meters.
        cert.pem: "{{ .CERT_PEM }}"
        key.pem: "{{ .KEY_PEM }}"
        PRIMARY_METER_IP: "{{ .PRIMARY_METER_IP }}"
        SOLAR_METER_IP: "{{ .SOLAR_METER_IP }}"
        MQTT_USER: "{{ .XCEL_USER }}"
        MQTT_PASSWORD: "{{ .XCEL_PASS }}"
  # The PEMs are file attachments on the item, which dataFrom.extract skips:
  # it only returns fields. A file has to be named with the file/ prefix.
  data:
    - secretKey: CERT_PEM
      remoteRef:
        key: xcel-meter
        property: file/cert.pem
    - secretKey: KEY_PEM
      remoteRef:
        key: xcel-meter
        property: file/key.pem
  dataFrom:
    - extract:
        key: xcel-meter
    - extract:
        key: mosquitto
