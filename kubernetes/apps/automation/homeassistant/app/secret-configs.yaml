---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hass-secret-configs
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hass-secret-configs
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        secrets.yaml: |
          homeassistant_latitude: {{ .LATITUDE }}
          homeassistant_longitude: {{ .LONGITUDE }}
          homeassistant_elevation: {{ .ELEVATION }}
          # Client-certificate login (templates/postgres-client); the query
          # string goes to libpq as-is. The server isn't verified because its
          # CA shares a Secret with the CA private key.
          recorder_db_url: postgresql://homeassistant@postgres-rw.database.svc.cluster.local/homeassistant?sslmode=require&sslcert=/postgres/tls.crt&sslkey=/postgres/tls.key
          ecobee_api_key: {{ .ECOBEE_API_KEY }}
          influxdb_password: {{ .INFLUXDB_HA_PASSWORD }}
  dataFrom:
    - extract:
        key: homeassistant-secrets
    - extract:
        # INFLUXDB_HA_PASSWORD: the write-only v1 user influxdb2's bootstrap
        # sidecar keeps in place (observability/influxdb2)
        key: influxdb
