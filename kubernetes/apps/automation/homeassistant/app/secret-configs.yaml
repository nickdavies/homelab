---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hass-secret-configs
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hass-secret-configs
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        secrets.yaml: |
          homeassistant_latitude: {{ .LATITUDE }}
          homeassistant_longitude: {{ .LONGITUDE }}
          homeassistant_elevation: {{ .ELEVATION }}
          recorder_db_url: postgresql://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASS }}@postgres-rw.database.svc.cluster.local/homeassistant
          ecobee_api_key: {{ .ECOBEE_API_KEY }}
          # MQTT broker login for the config_bridge component: the one the
          # mosquitto password file gives HASS_USER. toJson, because a JSON
          # string is valid YAML whatever the password contains.
          mqtt_username: {{ .HASS_USER | toJson }}
          mqtt_password: {{ .HASS_PASS | toJson }}
  dataFrom:
    # First, so any key it shares with homeassistant-secrets loses to that
    # item and nothing already in this file changes value.
    - extract:
        key: mosquitto
    - extract:
        key: homeassistant-secrets
