---
# rtlamr2mqtt decodes meter broadcasts from a local USB SDR and publishes them
# to MQTT. It serves nothing, so all ingress is denied, and its only network
# peer is Mosquitto (1883).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rtlamr2mqtt
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rtlamr2mqtt
      app.kubernetes.io/controller: rtlamr2mqtt
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mosquitto
      ports:
        - { port: 1883, protocol: TCP }
