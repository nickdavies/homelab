---
# The route targets port 5000, Frigate's unauthenticated port: it ignores both
# Frigate's own auth setting and proxy auth headers, so this policy is the only
# gate. Same Authelia
# ext-authz wiring as automation/rethink/app/securitypolicy.yaml, which
# explains each field.
#
# Home Assistant's Frigate integration dials
# frigate.automation.svc.cluster.local:5000 and never passes through this route.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: frigate-authelia
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: frigate
  extAuth:
    headersToExtAuth:
      - accept
      - cookie
      - location
      - authorization
      - proxy-authorization
      - x-forwarded-proto
    failOpen: false
    http:
      backendRefs:
        - kind: Service
          name: authelia
          namespace: security
          port: 80
      path: /api/authz/ext-authz/
