version: "0.18-0"

model:
  # yolov9s 640x640 2025.3
  path: plus://75eafa2f3843347dd8e431c1763a0fb8
  width: 640
  height: 640


mqtt:
  host: mosquitto.automation.svc.cluster.local
  port: 1883
  user: '{FRIGATE_MQTT_USERNAME}'
  password: '{FRIGATE_MQTT_PASSWORD}'
  topic_prefix: frigate

database:
  path: /config/frigate.db

detectors:
  ov_1:
    type: openvino
    device: GPU

face_recognition:
  enabled: true

lpr:
  enabled: true

auth:
  enabled: False
  trusted_proxies:
    - 10.69.0.0/16
    - 10.0.80.0/28

ffmpeg:
  hwaccel_args: preset-intel-qsv-h264
  output_args:
    record: preset-record-generic-audio-copy

live:
  height: 720
  quality: 1

birdseye:
  enabled: True
  mode: objects

go2rtc:
  streams:
    doorbell_main:
      - rtsp://{FRIGATE_CAMERA_USER}:{FRIGATE_CAMERA_PASSWORD}@{FRIGATE_DOORBELL_IP}:554/h264Preview_01_main
    doorbell_sub:
      - rtsp://{FRIGATE_CAMERA_USER}:{FRIGATE_CAMERA_PASSWORD}@{FRIGATE_DOORBELL_IP}:554/h264Preview_01_sub

    driveway_wide_sub:
      - rtsp://{FRIGATE_CAMERA_USER}:{FRIGATE_CAMERA_PASSWORD}@{FRIGATE_DRIVEWAY_IP}:554/Preview_01_sub
    driveway_zoom_sub:
      - rtsp://{FRIGATE_CAMERA_USER}:{FRIGATE_CAMERA_PASSWORD}@{FRIGATE_DRIVEWAY_IP}:554/Preview_02_sub

    bay_window_wide_sub:
      - rtsp://{FRIGATE_CAMERA_USER}:{FRIGATE_CAMERA_PASSWORD}@{FRIGATE_BAY_WINDOW_IP}:554/Preview_01_sub
    bay_window_zoom_sub:
      - rtsp://{FRIGATE_CAMERA_USER}:{FRIGATE_CAMERA_PASSWORD}@{FRIGATE_BAY_WINDOW_IP}:554/Preview_02_sub

    mountain_side_wide_sub:
      - rtsp://{FRIGATE_CAMERA_USER}:{FRIGATE_CAMERA_PASSWORD}@{FRIGATE_MOUNTAIN_SIDE_IP}:554/Preview_01_sub
    mountain_side_zoom_sub:
      - rtsp://{FRIGATE_CAMERA_USER}:{FRIGATE_CAMERA_PASSWORD}@{FRIGATE_MOUNTAIN_SIDE_IP}:554/Preview_02_sub

objects:
  track:
    - amazon
    - bear
    - bicycle
    - bird
    - car
    - cat
    - cow
    - deer
    - dhl
    - dog
    - face
    - fedex
    - horse
    - license_plate
    - motorcycle
    - package
    - person
    - ups
    - usps
    - waste_bin
  filters:
    cat:
      threshold: 0.75
    car:
      threshold: 0.8

record:
  enabled: true
  continuous:
    days: 7
  motion:
    days: 7
  detections:
    retain:
      days: 10
      mode: active_objects
  alerts:
    pre_capture: 5
    post_capture: 5
    retain:
      days: 14
      mode: active_objects

detect:
  enabled: True

review:
  alerts:
    labels:
      - person
      - car
      - motorcycle
      - cat
      - package
      - face
      - licence_plate
  detections:
    labels:
      - amazon
      - bear
      - bicycle
      - bird
      - car
      - cat
      - cow
      - deer
      - dhl
      - dog
      - face
      - fedex
      - horse
      - license_plate
      - motorcycle
      - package
      - person
      - ups
      - usps
cameras:
  doorbell:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/doorbell_main
          input_args: preset-rtsp-restream
          roles:
            - record
            - detect
    objects:
      track:
        - person
        - face
        - dog
        - package
    review:
      alerts:
        labels:
          - person
          - cat
          - face
    motion:
      mask:
        timestamp:
          friendly_name: Timestamp
          coordinates: "0.341,0,0.644,0,0.645,0.049,0.342,0.049"
    snapshots:
      enabled: True
      timestamp: False
      bounding_box: True
      crop: False
    lpr:
      enabled: False  # No road here
    mqtt:
      enabled: True
      timestamp: False
      crop: True

  driveway_wide:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_CAMERA_USER}:{FRIGATE_CAMERA_PASSWORD}@{FRIGATE_DRIVEWAY_IP}:554/Preview_01_main
          input_args: preset-rtsp-restream
          roles:
            - record
            - audio
        - path: rtsp://127.0.0.1:8554/driveway_wide_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    motion:
      mask:
        timestamp:
          friendly_name: Timestamp
          coordinates: "0.291,0.011,0.708,0.013,0.708,0.074,0.291,0.075"
        left_neighbours:
          friendly_name: Left neighbours
          coordinates: "0.249,0.222,0.322,0.176,0.322,0,0.001,0.002,0.001,0.459"
        footpath:
          friendly_name: Footpath
          coordinates: "0.18,0.18,0.65,0.18,0.65,0,0.18,0"
        tree:
          friendly_name: Tree
          coordinates: "0.866,0.269,0.998,0.271,1,0.741,0.866,0.719"
    detect:
      width: 896
      height: 512
    review:
      alerts:
        labels:
          - person
          - car
          - motorcycle
    objects:
      mask:
        left_neighbours:
          friendly_name: Left neighbours
          coordinates: "0.249,0.222,0.322,0.176,0.322,0,0.001,0.002,0.001,0.459"
        stupid_rock:
          friendly_name: Stupid rock
          coordinates: "0.816,0.335,0.923,0.343,0.93,0.535,0.81,0.52"
      filters:
        car:
          # attempt to filter out cars on the road but not in the driveway
          min_area: 1500
          mask:
            roadway:
              friendly_name: Roadway
              coordinates: "0.185,0.182,0.63,0.144,0.634,0,0.182,0"
    snapshots:
      enabled: True
      timestamp: False
      bounding_box: True
      crop: False
    lpr:
      enabled: true
    mqtt:
      enabled: True
      timestamp: False
      crop: True

  driveway_zoom:
    detect:
      enabled: false
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_CAMERA_USER}:{FRIGATE_CAMERA_PASSWORD}@{FRIGATE_DRIVEWAY_IP}:554/h264Preview_02_main
          hwaccel_args: preset-intel-qsv-h265
          roles:
            - record
            - audio
        - path: rtsp://127.0.0.1:8554/driveway_zoom_sub
          input_args: preset-rtsp-restream
          roles:
            - detect

  bay_window_wide:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_CAMERA_USER}:{FRIGATE_CAMERA_PASSWORD}@{FRIGATE_BAY_WINDOW_IP}:554/Preview_01_main
          input_args: preset-rtsp-restream
          roles:
            - record
            - audio
        - path: rtsp://127.0.0.1:8554/bay_window_wide_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    motion:
      mask:
        timestamp:
          friendly_name: Timestamp
          coordinates: "0.291,0.011,0.708,0.013,0.708,0.074,0.291,0.075"
    detect:
      width: 896
      height: 512
    review:
      alerts:
        labels:
          - person
          - car
          - motorcycle
    objects:
      filters:
        car:
          # attempt to filter out cars on the road but not in the dirveway
          min_area: 1000
    snapshots:
      enabled: True
      timestamp: False
      bounding_box: True
      crop: False
    lpr:
      enabled: False
    mqtt:
      enabled: True
      timestamp: False
      crop: True

  bay_window_zoom:
    detect:
      enabled: false
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_CAMERA_USER}:{FRIGATE_CAMERA_PASSWORD}@{FRIGATE_BAY_WINDOW_IP}:554/h264Preview_02_main
          hwaccel_args: preset-intel-qsv-h265
          roles:
            - record
            - audio
        - path: rtsp://127.0.0.1:8554/bay_window_zoom_sub
          input_args: preset-rtsp-restream
          roles:
            - detect

  mountain_side_wide:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_CAMERA_USER}:{FRIGATE_CAMERA_PASSWORD}@{FRIGATE_MOUNTAIN_SIDE_IP}:554/Preview_01_main
          input_args: preset-rtsp-restream
          roles:
            - record
            - audio
        - path: rtsp://127.0.0.1:8554/mountain_side_wide_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    motion:
      mask:
        timestamp:
          friendly_name: Timestamp
          coordinates: "0.291,0.011,0.708,0.013,0.708,0.074,0.291,0.075"
    detect:
      width: 896
      height: 512
    review:
      alerts:
        labels:
          - person
          - car
          - motorcycle
    objects:
      filters:
        car:
          # attempt to filter out cars on the road in the distance
          min_area: 1000
    snapshots:
      enabled: True
      timestamp: False
      bounding_box: True
      crop: False
    lpr:
      enabled: False # there is no road here
    mqtt:
      enabled: True
      timestamp: False
      crop: True

  mountain_side_zoom:
    detect:
      enabled: false
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_CAMERA_USER}:{FRIGATE_CAMERA_PASSWORD}@{FRIGATE_MOUNTAIN_SIDE_IP}:554/h264Preview_02_main
          hwaccel_args: preset-intel-qsv-h265
          roles:
            - record
            - audio
        - path: rtsp://127.0.0.1:8554/mountain_side_zoom_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
