# Only the internal gateway's Envoy proxy may reach the management interface.
# It is unauthenticated, so Authelia on rethink.internal (securitypolicy.yaml)
# only helps if nothing can go around the route.
#
# This covers the cluster interface only, which is where management (44401)
# binds. The ThinQ listeners bind the multus-not macvlan address, and
# NetworkPolicy doesn't apply to secondary interfaces. Ingress only: rethink
# dials out to Mosquitto and the LG cloud. Kubelet probes come from the node,
# which a NetworkPolicy never blocks.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rethink
spec:
  podSelector:
    matchLabels:
      app: rethink
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: internal
              gateway.envoyproxy.io/owning-gateway-namespace: network
      ports:
        - protocol: TCP
          port: 44401
