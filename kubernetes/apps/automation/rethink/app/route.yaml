---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rethink
spec:
  hostnames:
    - "rethink.internal.${SECRET_DOMAIN}"
  parentRefs:
    - name: internal
      namespace: network
  rules:
    - backendRefs:
        # Backend port only. Clients hit https://rethink.internal.${SECRET_DOMAIN}
        # on 443; Envoy terminates TLS and proxies here.
        - kind: Service
          name: rethink
          port: 44401
