---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats
spec:
  interval: 30m
  chart:
    spec:
      chart: nats
      version: 2.15.0
      sourceRef:
        kind: HelmRepository
        name: nats
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    config:
      # A single server. Ceph already replicates the JetStream volume, so the
      # cost is only a few seconds of downtime on restarts. Moving to 3 later
      # (cluster.enabled, replicas: 3, then raise each stream to replicas: 3)
      # needs no client changes.
      cluster:
        enabled: false
      jetstream:
        enabled: true
        fileStore:
          pvc:
            size: 10Gi
            storageClassName: ceph-block
          # Below the PVC size, so JetStream starts refusing writes before the
          # filesystem fills up underneath it.
          maxSize: 9Gi
        memoryStore:
          enabled: false
      # Clients must present a certificate from the nats-ca Issuer
      # (../pki), and its subject becomes their user: CN=admin logs in as
      # the "CN=admin" user below. There are no passwords, and none can be
      # added while verify_and_map is on, since every login is checked
      # against a certificate.
      nats:
        tls:
          enabled: true
          secretName: nats-server-tls
          merge:
            # The issued Secret's own ca.crt, so the pod never mounts nats-ca.
            ca_file: /etc/nats-certs/nats/ca.crt
            verify_and_map: true
      merge:
        # SYS is NATS's own system account (server events, `nats server`
        # commands). APP is where every stream lives; users in other accounts
        # can't see its subjects at all.
        #
        # Add a user per workload, scoped to the subjects it needs, and issue
        # its certificate with kubernetes/templates/nats-client. A worker
        # pulling from durable consumer "sanitizer" on EVENTS_EMAIL and
        # publishing its results needs:
        #   - user: CN=email-sanitizer
        #     permissions:
        #       publish:
        #         - "$JS.API.CONSUMER.INFO.EVENTS_EMAIL.sanitizer"
        #         - "$JS.API.CONSUMER.MSG.NEXT.EVENTS_EMAIL.sanitizer"
        #         - "$JS.ACK.EVENTS_EMAIL.sanitizer.>"
        #         - "tasks.email.>"
        #       subscribe: ["_INBOX.>"]
        # The config reloader applies changes here without a restart.
        system_account: SYS
        accounts:
          SYS:
            users:
              - user: CN=sys
          APP:
            jetstream: enabled
            users:
              - user: CN=admin
              # NACK only manages streams and consumers through the
              # JetStream API, and can't publish or read events.
              - user: CN=nack
                permissions:
                  publish: ["$JS.API.>"]
                  subscribe: ["_INBOX.>"]

    container:
      env:
        # ~80% of the memory limit, so the Go GC works harder before the
        # kernel OOM-kills the pod.
        GOMEMLIMIT: 200MiB
      merge:
        resources:
          requests:
            cpu: 10m
          limits:
            memory: 256Mi
        securityContext: &securityContext
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }

    # Watches the config and the server certificate, and signals the server to
    # reload when either changes.
    reloader:
      merge:
        resources:
          requests:
            cpu: 5m
          limits:
            memory: 32Mi
        securityContext: *securityContext

    promExporter:
      enabled: true
      podMonitor:
        enabled: true
      merge:
        resources:
          requests:
            cpu: 5m
          limits:
            memory: 32Mi
        securityContext: *securityContext

    podTemplate:
      merge:
        spec:
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            runAsNonRoot: true
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch

    # A pod with the `nats` CLI, logged in with the admin certificate. The
    # `sys` context uses the system account. This is also the way in when
    # nothing outside the cluster has a certificate:
    #   kubectl -n messaging exec -it deploy/nats-box -- nats stream ls
    #   kubectl -n messaging exec -it deploy/nats-box -- nats --context sys server list
    natsBox:
      enabled: true
      contexts:
        default:
          tls:
            secretName: nats-admin-tls
          merge:
            ca: /etc/nats-certs/default/ca.crt
        sys:
          tls:
            secretName: nats-sys-tls
          merge:
            ca: /etc/nats-certs/sys/ca.crt
      container:
        merge:
          resources:
            requests:
              cpu: 5m
            limits:
              memory: 64Mi
