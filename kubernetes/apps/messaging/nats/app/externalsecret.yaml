---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nats
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: nats-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Included by the server config (helmrelease.yaml). The config reloader
        # watches this file, so a rotated password applies without a restart.
        #
        # SYS is NATS's own system account (server events, `nats server`
        # commands). APP is where every stream lives; users in other accounts
        # can't see its subjects at all.
        #
        # Add a user per workload here, scoped to the subjects it needs, e.g.
        #   { user: email-sanitizer, password: ..., permissions: {
        #       publish: ["tasks.email.>", "$JS.API.>"],
        #       subscribe: ["_INBOX.>"] } }
        auth.conf: |
          system_account: SYS
          accounts: {
            SYS: {
              users: [
                { user: sys, password: {{ .NATS_SYS_PASSWORD | quote }} }
              ]
            }
            APP: {
              jetstream: enabled
              users: [
                { user: admin, password: {{ .NATS_ADMIN_PASSWORD | quote }} }
                # NACK only manages streams and consumers through the JetStream
                # API. It logs in with an NKey: the server holds only the public
                # half, and NACK signs a challenge with the seed (../nack).
                {
                  nkey: {{ .NATS_NACK_NKEY_PUBLIC | quote }}
                  permissions: {
                    publish: ["$JS.API.>"]
                    subscribe: ["_INBOX.>"]
                  }
                }
              ]
            }
          }
        # For nats-box, so `kubectl exec` into it can run `nats` as admin.
        ADMIN_USER: admin
        ADMIN_PASSWORD: "{{ .NATS_ADMIN_PASSWORD }}"
  dataFrom:
    - extract:
        key: nats
