---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app nats
  namespace: flux-system
spec:
  targetNamespace: messaging
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets
    - name: rook-ceph-cluster
  path: ./kubernetes/apps/messaging/nats/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app nack
  namespace: flux-system
spec:
  targetNamespace: messaging
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets
    - name: nats
  path: ./kubernetes/apps/messaging/nats/nack
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  wait: true # nats-streams needs the CRDs this installs
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nats-streams
  namespace: flux-system
spec:
  targetNamespace: messaging
  commonMetadata:
    labels:
      app.kubernetes.io/name: nats
  dependsOn:
    - name: nack
  path: ./kubernetes/apps/messaging/nats/streams
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
