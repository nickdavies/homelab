apiVersion: v1
kind: Namespace
metadata:
  name: workspaces
  labels:
    # No root, no privilege escalation, no sudo inside workspaces.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Pods get an API token only if their spec asks for one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: workspaces
automountServiceAccountToken: false
