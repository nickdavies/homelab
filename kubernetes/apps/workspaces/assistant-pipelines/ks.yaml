# The workspace's home PVC (ws-<name>) with hourly Garage and daily R2
# backups, restored from backup on creation. Movers run as the workspace
# user so restored files keep uid 1000.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app workspace-assistant-pipelines-home
  namespace: flux-system
spec:
  targetNamespace: workspaces
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/templates/volsync
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  dependsOn:
    - name: external-secrets
    - name: volsync
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: ws-assistant-pipelines
      VOLSYNC_CAPACITY: 50Gi
      VOLSYNC_PUID: "1000"
      VOLSYNC_PGID: "1000"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app workspace-assistant-pipelines
  namespace: flux-system
spec:
  targetNamespace: workspaces
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/workspaces/assistant-pipelines
  prune: true
  sourceRef:
    kind: GitRepository
    name: agent-workspaces
  serviceAccountName: workspace-reconciler
  dependsOn:
    - name: workspace-assistant-pipelines-home
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      WS_NAME: assistant-pipelines
