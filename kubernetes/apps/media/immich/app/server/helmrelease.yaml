# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app immich-server
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      immich:
        strategy: RollingUpdate
        annotations:
          secret.reloader.stakater.com/reload: immich-secret
          configmap.reloader.stakater.com/reload: immich-configmap
        pod:
          enableServiceLinks: false
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups: [44, 100]
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: *app
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.3.1
            env:
              - name: IMMICH_CONFIG_FILE
                value: /config/config.json
              # Client-certificate login as the immich superuser
              # (database/cloudnative-pg/immich/client.yaml). Parsed by
              # pg-connection-string, where plain sslmode=require would verify
              # the server; uselibpqcompat gives libpq's meaning instead, and
              # Immich strips it before handing the URL to pg_dumpall. The
              # server isn't verified because its CA shares a Secret with the
              # CA private key.
              - name: DB_URL
                value: postgres://immich@immich-rw.database.svc.cluster.local:5432/immich?uselibpqcompat=true&sslmode=require&sslcert=/postgres/tls.crt&sslkey=/postgres/tls.key
            envFrom:
              - secretRef:
                  name: immich-secret
              - configMapRef:
                  name: immich-configmap
    service:
      app:
        controller: immich
        ports:
          http:
            port: 2283
    persistence:
      config:
        type: secret
        name: immich-config-secret
        globalMounts:
          - path: /config/
            readOnly: true
      library:
        type: nfs
        server: ${SECRET_NFS_DOMAIN}
        path: /volume1/k8s/immich
        globalMounts:
          - path: /usr/src/app/upload
      media:
        type: nfs
        server: ${SECRET_NFS_DOMAIN}
        path: /volume1/photos/shared
        globalMounts:
          - path: /usr/src/app/external
      geocoding-dump:
        type: emptyDir
        globalMounts:
          - path: /usr/src/app/.reverse-geocoding-dump
      transformers-cache:
        type: emptyDir
        globalMounts:
          - path: /usr/src/app/.transformers_cache
      # Group-owned by the pod's fsGroup 568. pg_dumpall's libpq accepts a
      # root-owned key at 0640 or tighter.
      postgres-client-cert:
        type: secret
        name: immich-postgres-client-cert
        defaultMode: 0440
        advancedMounts:
          immich:
            app:
              - path: /postgres
                readOnly: true
