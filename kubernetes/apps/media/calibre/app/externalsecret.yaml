---
# One password per declared user (config/users.json), each a field of the
# 1Password item named after the user. Mounted as one file per user for
# calibre-users-sync, which fails the pod if a declared user has no file.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: calibre-users
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: calibre-users
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        web: "{{ .web }}"
        nick: "{{ .nick }}"
        nick-reader: '{{ index . "nick-reader" }}'
        britta-reader: '{{ index . "britta-reader" }}'
  dataFrom:
    - extract:
        key: calibre
---
# The Authorization header Envoy injects on the books.internal route
# (httproutefilter.yaml), so the web UI never shows calibre's Basic-auth popup.
# Envoy Gateway reads the value from the "credential" key.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: calibre-web-credential
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: calibre-web-credential
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        credential: '{{ printf "web:%s" .web | b64enc | printf "Basic %s" }}'
  dataFrom:
    - extract:
        key: calibre
