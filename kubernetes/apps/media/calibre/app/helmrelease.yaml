# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app calibre
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
      strategy: rollback
  values:
    controllers:
      calibre:
        # SQLite on an RWO volume, and calibre requires a single writer: never
        # run two pods at once.
        strategy: Recreate
        annotations:
          # A password change in 1Password restarts the pod, which re-runs
          # calibre-users-sync.
          reloader.stakater.com/auto: 'true'
        pod:
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            # The image's uid/gid and VolSync's default mover's, so backups and
            # restores keep ownership.
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
        initContainers:
          library:
            image: &image
              # https://github.com/nickdavies/calibre-server-image
              repository: ghcr.io/nickdavies/calibre-server-image
              tag: 9.19.0@sha256:035ccbafdf22f02e4cd8450a65af63a1bb50f18c196dae22afb3c390cdb52d9c
            # calibre-server refuses to start without a library; calibredb
            # creates an empty one on a fresh volume and only reads an existing
            # one. On a volume whose VolSync restore came back empty this also
            # starts an empty library, as any app's fresh database would.
            command: [calibredb, --with-library, /config/library, list]
            env: &env
              CALIBRE_CACHE_DIRECTORY: /tmp/cache
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
          users:
            image: *image
            # Makes the user database match config/users.json, updating users
            # in place so their KOSync reading progress survives.
            command:
              - calibre-debug
              - -e
              - /opt/calibre-users-sync.py
              - --
              - /config/users.sqlite
              - /etc/calibre/users.json
              - /etc/calibre/passwords
            env: *env
            securityContext: *securityContext
        containers:
          app:
            image: *image
            args:
              - --enable-auth
              # calibre's default picks Digest over plain HTTP, which is what
              # it sees behind Envoy; the e-readers only speak Basic.
              - --auth-mode=basic
              - --userdb=/config/users.sqlite
              - --disable-use-bonjour
              - --port=8080
              # The library ID is the directory name: calibredb targets
              # https://books-api.internal.../#library
              - /config/library
            env: *env
            securityContext: *securityContext
            probes:
              # The server's pages need a login, so probe the port.
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
              readiness: *probe
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
    service:
      app:
        controller: calibre
        ports:
          http:
            port: 8080
    persistence:
      # Library, user database and calibre's config, all backed up by VolSync.
      config:
        existingClaim: *app
        globalMounts:
          - path: /config
      users:
        type: configMap
        name: calibre-users
        advancedMounts:
          calibre:
            users:
              - path: /etc/calibre/users.json
                subPath: users.json
                readOnly: true
      passwords:
        type: secret
        name: calibre-users
        advancedMounts:
          calibre:
            users:
              - path: /etc/calibre/passwords
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
