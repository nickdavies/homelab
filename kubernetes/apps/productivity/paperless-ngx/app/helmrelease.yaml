# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app paperless-ngx
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
      strategy: rollback
  values:
    controllers:
      paperless-ngx:
        annotations:
          reloader.stakater.com/auto: 'true'
        initContainers:
          # Paperless drops to uid 568 / gid 100, and libpq only accepts a key
          # it owns at 0600 (or root-owned at 0640). A Secret volume is
          # root-owned with its group set by fsGroup, and fsGroup 100 would
          # re-own the whole document volume, so copy the pair into memory
          # owned by the paperless user instead. Reloader restarts the pod
          # when CNPG renews the certificate.
          01-postgres-client-cert:
            image: &image
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.3.0
            command:
              - sh
              - -c
              - >-
                install -o 568 -g 100 -m 0400 /postgres-client-cert/tls.key /postgres/tls.key &&
                install -o 568 -g 100 -m 0444 /postgres-client-cert/tls.crt /postgres/tls.crt
        containers:
          gotenburg:
            image:
              repository: thecodingmachine/gotenberg
              tag: 8.30.1
              pullPolicy: IfNotPresent
            env:
              - {name: DISABLE_GOOGLE_CHROME, value: '1'}
          tika:
            image:
              repository: docker.io/apache/tika
              tag: 3.3.1.0-full
              pullPolicy: IfNotPresent
          app:
            image: *image
            envFrom:
              - secretRef:
                  name: paperless-secret
            env:
              USERMAP_UID: 568
              USERMAP_GID: 100
              PAPERLESS_DBENGINE: postgresql
              PAPERLESS_DBHOST: postgres-rw.database.svc.cluster.local
              PAPERLESS_DBPORT: 5432
              PAPERLESS_DBNAME: paperless
              PAPERLESS_DBUSER: paperless
              # Encrypted and client-authenticated; the server isn't verified
              # because its CA shares a Secret with the CA private key.
              PAPERLESS_DBSSLMODE: require
              PAPERLESS_DBSSLCERT: /postgres/tls.crt
              PAPERLESS_DBSSLKEY: /postgres/tls.key
              PAPERLESS_TIME_ZONE: "${TIMEZONE}"
              PAPERLESS_PORT: &port 80
              PAPERLESS_REDIS: redis://dragonfly.database.svc.cluster.local:6379
              PAPERLESS_TASK_WORKERS: 2
              PAPERLESS_TIKA_ENABLED: 1
              PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://localhost:3000
              PAPERLESS_TIKA_ENDPOINT: http://localhost:9998
              PAPERLESS_URL: https://paperless.internal.${SECRET_DOMAIN}
              PAPERLESS_ALLOWED_HOSTS: paperless.internal.${SECRET_DOMAIN},paperless-ngx.default.svc.cluster.local
              PAPERLESS_CONSUMPTION_DIR: /library/consume
              PAPERLESS_DATA_DIR: /data/data
              PAPERLESS_MEDIA_ROOT: /data/media
              PAPERLESS_EXPORT_DIR: /data/export
              PAPERLESS_CONSUMER_POLLING: 60
              PAPERLESS_CONSUMER_IGNORE_PATTERNS: '[".DS_STORE/*", "._*", ".stfolder/*", "@eaDir/*"]'
              PAPERLESS_TRUSTED_PROXIES: 10.96.0.0/16
              PAPERLESS_CONSUMER_DELETE_DUPLICATES: true
              PAPERLESS_CONSUMER_RECURSIVE: true
              PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: true
              PAPERLESS_OCR_LANGUAGE: eng
              PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
              PAPERLESS_SOCIAL_AUTO_SIGNUP: true
              PAPERLESS_SOCIAL_ACCOUNT_DEFAULT_GROUPS: default_reader
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 6Gi
    service:
      app:
        controller: paperless-ngx
        ports:
          http:
            port: *port
    persistence:
      config:
        enabled: true
        existingClaim: *app
        advancedMounts:
          paperless-ngx:
            app:
              - path: /data
      downloads:
        type: nfs
        server: ${SECRET_NFS_DOMAIN}
        path: /volume1/paperless-consume/
        globalMounts:
          - path: /library
      postgres-client-cert:
        type: secret
        name: paperless-postgres-client-cert
        advancedMounts:
          paperless-ngx:
            01-postgres-client-cert:
              - path: /postgres-client-cert
                readOnly: true
      postgres:
        type: emptyDir
        medium: Memory
        advancedMounts:
          paperless-ngx:
            01-postgres-client-cert:
              - path: /postgres
            app:
              - path: /postgres
                readOnly: true
