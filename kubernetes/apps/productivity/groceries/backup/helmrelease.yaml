# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app groceries-recipe-backup
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      labels:
        # Allowed to push its success metrics (observability/pushgateway).
        pushgateway.homelab/push: "true"
      securityContext:
        # VolSync's default mover uid/gid, so backups and restores keep ownership.
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    controllers:
      # Copies every AnyList recipe and its photos to the PVC, content-addressed
      # (see the groceries README). The app edits recipe ingredient names, and some
      # recipes can't be replaced, so this keeps every version VolSync can restore.
      # A failed run exits 1 and pushes nothing; RecipeBackupStale alerts off the
      # timestamp a successful run pushes last.
      backup:
        type: cronjob
        cronjob:
          concurrencyPolicy: Forbid
          schedule: '*/30 * * * *'
          backoffLimit: 2
          ttlSecondsAfterFinished: 3600
        containers:
          app:
            image:
              repository: ghcr.io/nickdavies/groceries
              tag: main@sha256:0f2b1ce5fac1e8cc8d4e8b3d826cdc6088c81690933e12734b46234f955d12df
            command: [python, -m, groceries.backup]
            envFrom:
              # Only ANYLIST_EMAIL and ANYLIST_PASSWORD are used.
              - secretRef:
                  name: groceries-secret
            env:
              BACKUP_DIR: /backup
              PRUNE_DAYS: '90'
              PUSHGATEWAY_URL: http://pushgateway.observability.svc.cluster.local:9091
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 512Mi
    persistence:
      backup:
        existingClaim: *app
        globalMounts:
          - path: /backup
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
