apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: groceries
spec:
  hostnames:
    - "groceries.internal.${SECRET_DOMAIN}"
  parentRefs:
    - name: internal
      namespace: network
  rules:
    - backendRefs:
        - kind: Service
          name: groceries
          port: 8000
