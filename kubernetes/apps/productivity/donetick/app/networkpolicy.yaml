# The internal gateway's Envoy (the web and phone apps) and Home Assistant,
# which calls the API directly at donetick.productivity.svc:2021 with its own
# API token.
#
# Ingress only: the server calls Authelia (through the gateway) and Pushover.
# Kubelet probes come from the node, which a NetworkPolicy never blocks.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: donetick
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: donetick
      app.kubernetes.io/controller: donetick
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: internal
              gateway.envoyproxy.io/owning-gateway-namespace: network
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: automation
          podSelector:
            matchLabels:
              app: homeassistant
      ports:
        - protocol: TCP
          port: 2021
