---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./networkpolicy.yaml
  - ./route.yaml
  - ../../../../templates/volsync
configMapGenerator:
  - name: donetick-config
    files:
      - ./config/selfhosted.yaml
generatorOptions:
  disableNameSuffixHash: true
