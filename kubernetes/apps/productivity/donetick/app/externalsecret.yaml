---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: donetick
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: donetick-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DT_JWT_SECRET: "{{ .DT_JWT_SECRET }}"
        DT_PUSHOVER_TOKEN: "{{ .DT_PUSHOVER_TOKEN }}"
        # The plain half of the pair whose hash Authelia's donetick client holds.
        DT_OAUTH2_CLIENT_SECRET: "{{ .DONETICK_OAUTH_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: donetick
    - extract:
        key: authelia
