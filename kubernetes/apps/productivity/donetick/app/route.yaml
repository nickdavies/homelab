---
# No Authelia SecurityPolicy: Donetick signs users in through Authelia's OIDC
# itself, and the phone app and API tokens send bearer tokens that a
# forward-auth check would reject.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: donetick
spec:
  hostnames:
    - "donetick.internal.${SECRET_DOMAIN}"
  parentRefs:
    - name: internal
      namespace: network
  rules:
    - backendRefs:
        - kind: Service
          name: donetick
          port: 2021
