---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-hub-approval-server-work
  namespace: flux-system
spec:
  targetNamespace: agent-hub
  commonMetadata:
    labels:
      app.kubernetes.io/name: approval-server-work
  path: ./kubernetes/apps/agent-hub/approval-server-work/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
