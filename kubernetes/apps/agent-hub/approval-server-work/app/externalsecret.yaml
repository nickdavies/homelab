---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: approval-server-work
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: approval-server-work-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AGENT_HUB_TOKENS: "{{ .AGENT_HUB_TOKENS }}"
        PUSHOVER_TOKEN: "{{ .PUSHOVER_TOKEN }}"
        PUSHOVER_USER: "{{ .PUSHOVER_USER }}"
        OAUTH_ALLOWED_EMAILS: "{{ .OAUTH_ALLOWED_EMAILS }}"
        OIDC_CLIENT_SECRET: "{{ .AGENT_HUB_APPROVAL_SERVER_WORK_OAUTH_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: agent-hub-approval-server-work
    - extract:
        key: authelia
