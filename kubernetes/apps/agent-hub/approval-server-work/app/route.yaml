---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: approval-server-work
spec:
  hostnames:
    - "work.ai.internal.${SECRET_DOMAIN}"
  parentRefs:
    - name: internal
      namespace: network
  rules:
    - backendRefs:
        - kind: Service
          name: approval-server-work
          port: 8080
