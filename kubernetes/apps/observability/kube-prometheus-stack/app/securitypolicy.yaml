---
# Prometheus has no authentication of its own. Its metrics include per-device
# presence from unpoller, and --web.enable-lifecycle (set by the operator for
# config reloads) lets any caller POST /-/quit. Same Authelia ext-authz wiring
# as automation/rethink/app/securitypolicy.yaml, which explains each field.
#
# Grafana queries the Service directly and never passes through this route.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: prometheus-authelia
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: prometheus
  extAuth:
    headersToExtAuth:
      - accept
      - cookie
      - location
      - authorization
      - proxy-authorization
      - x-forwarded-proto
    failOpen: false
    http:
      backendRefs:
        - kind: Service
          name: authelia
          namespace: security
          port: 80
      path: /api/authz/ext-authz/
