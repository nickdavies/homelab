---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./grafana-datasource.yaml
  - ./helmrelease.yaml
  - ./route.yaml
  - ../../../../templates/volsync
configMapGenerator:
  - name: influxdb2-bootstrap
    files:
      - ./bootstrap.sh
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
