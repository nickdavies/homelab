---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: influxdb2
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: influxdb2-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # First-run setup: read by the image's entrypoint only when the data
        # volume is empty. Changing them later changes nothing in InfluxDB.
        DOCKER_INFLUXDB_INIT_USERNAME: "{{ .INFLUXDB_ADMIN_USER }}"
        DOCKER_INFLUXDB_INIT_PASSWORD: "{{ .INFLUXDB_ADMIN_PASSWORD }}"
        DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "{{ .INFLUXDB_ADMIN_TOKEN }}"

        # The bootstrap sidecar: the admin token it works with, and the v1
        # users' passwords it applies on every pod start.
        INFLUX_TOKEN: "{{ .INFLUXDB_ADMIN_TOKEN }}"
        INFLUXDB_HA_PASSWORD: "{{ .INFLUXDB_HA_PASSWORD }}"
        INFLUXDB_GRAFANA_PASSWORD: "{{ .INFLUXDB_GRAFANA_PASSWORD }}"
  dataFrom:
    - extract:
        # INFLUXDB_ADMIN_USER: the web UI's admin login
        # INFLUXDB_ADMIN_PASSWORD: its password (8+ characters)
        # INFLUXDB_ADMIN_TOKEN: the operator token; any long random string,
        #   e.g. `openssl rand -hex 32`
        # INFLUXDB_HA_PASSWORD: Home Assistant's v1 user (write-only)
        # INFLUXDB_GRAFANA_PASSWORD: Grafana's v1 user (read-only)
        key: influxdb
