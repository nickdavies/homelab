---
# InfluxDB holds Home Assistant's long-term history. Only its three clients
# may reach it, and it dials nothing.
#
#   ingress 8086   Home Assistant (the influxdb integration), Grafana (the
#                  Home Assistant datasource), and the internal gateway's
#                  Envoy (influxdb.internal)
#   egress  none   the bootstrap container talks to localhost, and usage
#                  reporting is off (INFLUXD_REPORTING_DISABLED)
#
# HA reaches it over the pod network, not its Multus interfaces. The VolSync
# movers carry their own labels and aren't selected here. Kubelet probes come
# from the node, which a NetworkPolicy never blocks.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: influxdb2
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: influxdb2
      app.kubernetes.io/controller: influxdb2
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: automation
          podSelector:
            matchLabels:
              app: homeassistant
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: internal
              gateway.envoyproxy.io/owning-gateway-namespace: network
      ports:
        - { port: 8086, protocol: TCP }
