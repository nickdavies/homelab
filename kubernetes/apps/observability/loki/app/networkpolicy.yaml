# Only Loki's known clients may reach it. Loki runs auth_enabled: false, so
# anything that can connect can read every log line in the cluster and write
# forged ones.
#
# Ingress only: Loki dials out to Alertmanager (ruler) and the apiserver (rules
# sidecar). Kubelet probes come from the node, which a NetworkPolicy never
# blocks.
---
# The gateway is the front door: Vector writes, Grafana queries. Prometheus
# scrapes the gateway's nginx metrics on the same port. The Service maps 80 to
# container port 8080, and the policy matches the container port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/component: gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vector-aggregator
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
---
# - The gateway proxies to 3100. Loki's own pods are allowed on every port so
#   memberlist and gRPC keep working when single-binary talks to itself.
# - Prometheus scrapes 3100/metrics.
# - The homelab ops workspace queries 3100 directly (agent-workspaces
#   components/ops/networkpolicy.yaml). Its egress policy is the other half.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-single-binary
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/component: single-binary
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: loki
              app.kubernetes.io/name: loki
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: workspaces
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - ws-homelab
                  - ws-homelab-remote-control
      ports:
        - protocol: TCP
          port: 3100
