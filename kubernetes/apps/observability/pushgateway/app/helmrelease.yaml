# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pushgateway
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
    controllers:
      # Where batch jobs report their last success, for freshness alerts. No
      # persistence: jobs push every run, and their "absent" alerts wait longer
      # than a run interval, so a restart only drops series until the next push.
      pushgateway:
        containers:
          app:
            # https://github.com/prometheus/pushgateway
            image:
              repository: quay.io/prometheus/pushgateway
              tag: v1.11.5@sha256:7332ee96119c0b927a3e64971189d884718939b6102c3e9e047bc11e83715d6f
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /-/healthy
                    port: &port 9091
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /-/ready
                    port: *port
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
    service:
      app:
        controller: pushgateway
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        enabled: true
        serviceName: pushgateway
        endpoints:
          # Keep the job/instance labels the pushers set, not the Pushgateway's own.
          - port: http
            scheme: http
            path: /metrics
            honorLabels: true
            scrapeTimeout: 5s
