---
# Copies grafana's Postgres client certificate out of the database namespace.
# CNPG issues and renews it there (database/cloudnative-pg/cluster/clients);
# this ServiceAccount can read that one Secret and no other.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-client-cert
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: postgres-client-cert
spec:
  provider:
    kubernetes:
      remoteNamespace: database
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: postgres-client-cert
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-postgres-client-cert
spec:
  # CNPG renews 7 days before expiry; an hourly copy picks that up well in time.
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: postgres-client-cert
  target:
    name: grafana-postgres-client-cert
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: grafana-client-cert
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        key: grafana-client-cert
        property: tls.key
