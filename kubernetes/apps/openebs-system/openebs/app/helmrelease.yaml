---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
spec:
  interval: 30m
  # The standalone hostpath provisioner chart, not the openebs 4.x umbrella:
  # the umbrella defaults to Mayastor, LVM, ZFS, Loki, Alloy and MinIO, and
  # bundles this same chart for its hostpath engine.
  chart:
    spec:
      chart: localpv-provisioner
      version: 4.6.0
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    hostpathClass:
      enabled: true
      name: openebs-hostpath
      isDefaultClass: false
      basePath: /var/openebs/local
    analytics:
      enabled: false
