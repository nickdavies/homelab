# garage-operator's access to pipelines, for the GarageBuckets and GarageKeys
# on garage-pipelines. Applied here, with the namespace, so it exists before
# the operator lists pipelines in watchNamespaces: a forbidden list/watch
# fails its cache sync and the manager exits.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-operator-manager
  namespace: pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: garage-operator-manager
subjects:
  - kind: ServiceAccount
    name: garage-operator
    namespace: garage-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-operator-key-secrets
  namespace: pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: garage-operator-key-secrets
subjects:
  - kind: ServiceAccount
    name: garage-operator
    namespace: garage-operator
