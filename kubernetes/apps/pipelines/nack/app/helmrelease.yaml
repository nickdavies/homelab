---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nack
spec:
  interval: 30m
  chart:
    spec:
      chart: nack
      version: 0.35.0
      sourceRef:
        kind: HelmRepository
        name: nats
        namespace: flux-system
  install:
    crds: CreateReplace
    # Its client certificate (nack-nats) is generated by
    # nick-assistant-pipelines, which only applies once this release (and
    # its CRDs) is Ready. Waiting for the pod would deadlock that.
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    disableWait: true
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # Modern names give the pod app.kubernetes.io/instance: nack, which the
    # generated NATS ingress policy admits.
    useLegacyNames: false
    namespaced: true
    jetstream:
      # KeyValue and ObjectStore CRs are only reconciled in control-loop mode.
      controlLoop: true
      nats:
        url: tls://nats.pipelines.svc:4222
      tls:
        enabled: true
        secretName: nack-nats
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile: { type: RuntimeDefault }
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: [ALL] }
  postRenderers:
    # Restart on certificate renewal; the chart only exposes pod annotations.
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: nack
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: nack
                annotations:
                  reloader.stakater.com/auto: "true"
