---
# Management handle: garage-operator manages buckets and keys on
# garage-pipelines through the admin API and deploys nothing. GarageBuckets
# and GarageKeys (generated by nick-assistant-pipelines) reference it by name.
#
# The token is scoped to the endpoints the operator calls for a handle,
# buckets and imported keys. Layout, admin-token and repair endpoints are
# deliberately excluded. Created once with:
#   garage admin-token create -q --scope GetClusterStatus,ListBuckets,
#     GetBucketInfo,CreateBucket,UpdateBucket,DeleteBucket,AddBucketAlias,
#     RemoveBucketAlias,AllowBucketKey,DenyBucketKey,GetKeyInfo,ImportKey,
#     UpdateKey,DeleteKey garage-operator
apiVersion: garage.rajsingh.info/v1beta2
kind: GarageCluster
metadata:
  name: garage-pipelines
spec:
  connectTo:
    adminApiEndpoint: http://garage-pipelines.pipelines.svc:3903
    adminTokenSecretRef:
      name: garage-pipelines-operator-token
      key: admin-token
