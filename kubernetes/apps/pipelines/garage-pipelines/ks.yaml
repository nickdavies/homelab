---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app garage-pipelines
  namespace: flux-system
spec:
  targetNamespace: pipelines
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets
    - name: rook-ceph-cluster
  path: ./kubernetes/apps/pipelines/garage-pipelines/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app garage-pipelines-handle
  namespace: flux-system
spec:
  targetNamespace: pipelines
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    # GarageCluster CRD
    - name: garage-operator
    - name: external-secrets
  path: ./kubernetes/apps/pipelines/garage-pipelines/handle
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 5m
