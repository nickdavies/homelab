# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage-pipelines
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  uninstall:
    keepHistory: false
  values:
    controllers:
      garage-pipelines:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: dxflrs/garage
              # renovate: depName=dxflrs/garage datasource=docker
              tag: v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
            env:
              TZ: ${TIMEZONE}
            envFrom:
              - secretRef:
                  name: garage-pipelines-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
            resources:
              requests:
                cpu: 50m
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: garage-pipelines
        ports:
          s3:
            port: 3900
          admin:
            port: 3903
    persistence:
      config:
        type: configMap
        name: garage-pipelines-configmap
        globalMounts:
          - path: /etc/garage.toml
            subPath: configuration.toml
      data:
        existingClaim: garage-pipelines-data
        globalMounts:
          - path: /data
      meta:
        existingClaim: garage-pipelines-meta
        globalMounts:
          - path: /meta
