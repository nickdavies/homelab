---
# Generated once and never stored outside the cluster. Regenerating it is
# harmless on a single node: rpc_secret only authenticates node-to-node RPC
# and the in-pod CLI, which read the same Secret.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: garage-pipelines-rpc-secret
spec:
  length: 32
  encoding: hex
  secretKeys: [GARAGE_RPC_SECRET]
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-pipelines
spec:
  refreshInterval: "0"
  target:
    name: garage-pipelines-secret
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: garage-pipelines-rpc-secret
