# Pull secret for the private assistant-pipelines images on ghcr.io, in both
# namespaces; the generator names it in every pod's imagePullSecrets. A
# read:packages token: pods never see it (no RBAC to read Secrets, and
# imagePullSecrets aren't mounted).
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: pipelines
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "nickdavies:%s" .token | b64enc }}"}}}'
  data:
    - secretKey: token
      remoteRef:
        key: ghcr-pull
        property: token
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: pipelines-agents
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "nickdavies:%s" .token | b64enc }}"}}}'
  data:
    - secretKey: token
      remoteRef:
        key: ghcr-pull
        property: token
