---
# The human debug identity for assistant-pipelines: the only NATS user that can
# read message content (AP_HISTORY) and LLM transcripts. Its Certificate and
# NATS grants are generated by core and deployed by nick-assistant-pipelines;
# only the Deployment lives here (core emit/k8s.rs, "admin identities whose
# Deployments are in homelab").
#
# Off by default. To debug:
#   kubectl -n pipelines scale deploy/ap-operator --replicas=1
#   kubectl -n pipelines exec -it deploy/ap-operator -- nats stream info AP_HISTORY
#   kubectl -n pipelines scale deploy/ap-operator --replicas=0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ap-operator
  annotations:
    # The client certificate rotates (rotationPolicy: Always).
    reloader.stakater.com/auto: "true"
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ap-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ap-operator
        # The generated NATS ingress policy (nats-clients) admits this label.
        app.kubernetes.io/instance: ap-operator
    spec:
      serviceAccountName: ap-operator
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nats-box
          # The -nonroot variant runs as nats (1000). natscli v0.5.0.
          image: docker.io/natsio/nats-box:0.20.1-nonroot@sha256:9eec37227e52bf4d207ffc246284034c18dd09d51bae0bfd2af9dbbd77ba4d44
          # Idle until exec'd into; exits promptly on SIGTERM.
          command: ["/bin/sh", "-c", "trap 'exit 0' TERM INT; while :; do sleep 3600 & wait $!; done"]
          env:
            - name: NATS_CONTEXT
              value: /etc/nats/context/ap-operator.json
            - name: HOME
              value: /home/nats
            # The image points this at /nsc/.config, which is read-only here.
            - name: XDG_CONFIG_HOME
              value: /home/nats/.config
            - name: XDG_DATA_HOME
              value: /home/nats/.local/share
          workingDir: /home/nats
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: tls
              mountPath: /etc/nats/tls
              readOnly: true
            - name: context
              mountPath: /etc/nats/context
              readOnly: true
            - name: home
              mountPath: /home/nats
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            # Generated by nick-assistant-pipelines (Certificate ap-operator-nats).
            secretName: ap-operator-nats
            defaultMode: 0400
        - name: context
          configMap:
            name: ap-operator-nats-context
        - name: home
          emptyDir: { sizeLimit: 64Mi }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
