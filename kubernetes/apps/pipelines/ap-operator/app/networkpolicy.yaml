---
# Egress to NATS only (the generated nats-clients policy admits it on the other
# side). DNS comes from the namespace baseline. No ingress: kubectl exec goes
# through the kubelet, not the pod network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ap-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: ap-operator
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - { port: 4222, protocol: TCP }
