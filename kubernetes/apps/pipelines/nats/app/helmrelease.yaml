---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats
spec:
  interval: 30m
  chart:
    spec:
      chart: nats
      version: 2.15.2
      sourceRef:
        kind: HelmRepository
        name: nats
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # Users and permissions are generated by nick-assistant-pipelines into
  # this ConfigMap as `config.merge.accounts`. The chart renders merge values
  # as JSON, so every subject is quoted and `$KV`/`$JS` aren't read as
  # variables. Optional, so NATS runs (accepting no one) before the first
  # generated apply.
  valuesFrom:
    - kind: ConfigMap
      name: nats-users-values
      valuesKey: values.yaml
      optional: true
  values:
    config:
      jetstream:
        enabled: true
        fileStore:
          pvc:
            size: 10Gi
            storageClassName: ceph-block
      nats:
        tls:
          enabled: true
          secretName: nats-server-tls
      # Every client presents a certificate; its URI SAN is its user name.
      merge:
        tls:
          verify_and_map: true
    tlsCA:
      enabled: true
      secretName: nats-server-tls
    # The chart sets no securityContext; the namespace enforces restricted.
    # Both containers share the pod's PID namespace and run as one uid, so
    # the reloader can still signal the server.
    podTemplate:
      merge:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
    container:
      merge:
        securityContext: &containerSecurityContext
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 1Gi
    reloader:
      merge:
        securityContext: *containerSecurityContext
    natsBox:
      enabled: false
