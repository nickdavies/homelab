---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minecraft-${SERVER_NAME}-server-config
  labels:
    role: service-config
    app: minecraft-${SERVER_NAME}
data:
  EULA: "TRUE"
  TYPE: NEOFORGE
  # Hardcoded, not substituted: Flux would turn "26.3" into a number. The mod jar pins both versions.
  VERSION: "26.3"
  NEOFORGE_VERSION: "26.3.0.26-beta"
  # Copied into /data/mods/oneblock.jar when it changes. A fixed file name, so an update replaces the old jar.
  MODS: /modpacks/oneblock/oneblock.jar
  MOTD: "running world: ${SERVER_NAME}!"
  DIFFICULTY: "${MC_DIFFICULTY}"
  MEMORY: "${MC_MEMORY_GB}G"
  EXISTING_WHITELIST_FILE: "SYNCHRONIZE"
  PVP: "false"
  # The mod sets the seed, world name, void world type, game mode and spawn protection from the .apmc itself.
