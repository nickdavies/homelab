---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: minecraft-${SERVER_NAME}
  name: minecraft-${SERVER_NAME}
spec:
  replicas: ${REPLICAS}
  serviceName: minecraft-${SERVER_NAME}
  selector:
    matchLabels:
      app: minecraft-${SERVER_NAME}
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app: minecraft-${SERVER_NAME}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      volumes:
        - name: world-data-vol
          persistentVolumeClaim:
            # We could just put $APP here but if SERVER_NAME and APP aren't in sync
            # then we wouldn't match the right server data (PV) up with the right configs
            # and DNS etc.
            #
            # This way if they aren't in sync this volume either won't exist or will be in use.
            claimName: minecraft-${SERVER_NAME}
        - name: modpacks
          nfs:
            server: ${SECRET_NFS_DOMAIN}
            path: /volume1/k8s/minecraft/modpacks
      containers:
        - name: mc
          # Minecraft 26.3 needs Java 25.
          image: itzg/minecraft-server:2026.10.1-java25@sha256:d12aed7e35981dfe259b60fbfee77d23a19b5898a7a31dca298d18b47b7b5776
          envFrom:
            - configMapRef:
                name: minecraft-${SERVER_NAME}-server-config
            - secretRef:
                name: minecraft-${SERVER_NAME}-secret
          volumeMounts:
            - mountPath: /data
              name: world-data-vol
            - mountPath: /modpacks
              name: modpacks
            # The mod loads the newest .apmc in /data/APData (it only reads it). Each seed gets its own world
            # folder, so dropping a new .apmc here and restarting switches seeds and keeps the old world.
            - mountPath: /data/APData
              name: modpacks
              subPath: oneblock/apdata
              readOnly: true
          # A first boot downloads NeoForge, so give it up to 10 minutes before liveness takes over.
          startupProbe:
            exec:
              command: &mc-status
                - mc-monitor
                - status
                - --host
                - localhost
                - --port
                - "25565"
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command: *mc-status
            periodSeconds: 5
            failureThreshold: 18
          # An in-game /stop shuts the server down, but the Archipelago mod's websocket thread keeps the JVM
          # alive, so the container never exits on its own. Restart it once the port has been dead for a minute.
          livenessProbe:
            exec:
              command: *mc-status
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
