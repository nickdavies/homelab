---
# Archipelago WebHost: the web UI and trackers, plus one game server per room
# in rooms.yaml, all in this pod. Rooms bind inside the pod's network
# namespace, so no hostNetwork: the archipelago-game Service exposes the room
# port range (service.yaml).
#
# Single replica only: the DB is SQLite and WebHost's locks are files in the
# container.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: archipelago
spec:
  replicas: 1
  serviceName: archipelago
  selector:
    matchLabels:
      app: archipelago
  template:
    metadata:
      labels:
        app: archipelago
    spec:
      # preStop takes a second or two; it gives the hosters up to 20s to save.
      terminationGracePeriodSeconds: 45
      securityContext:
        # The image runs as root from a root-owned /app it writes to at startup
        # (generated static docs, options files, file locks), so non-root isn't
        # an option without rebuilding it. fsGroup keeps the DB readable by the
        # VolSync movers, which run as 568.
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      initContainers:
        # Copies the hash-checked apworlds from the NAS into custom-worlds,
        # which reconcile and webhost mount at /app/custom_worlds. Only this
        # container sees the share itself.
        - name: apworlds
          image: &image ghcr.io/archipelagomw/archipelago:0.6.8@sha256:e99b395b24271ee225ce7e765ef7510c4e6e0f48cb7e3782da0a3a53d7ec98b2
          command: [python, /scripts/install_apworlds.py, /apworlds, /custom_worlds]
          env:
            - name: PYTHONPATH
              value: /app
          securityContext: &securityContext
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: apworlds
              mountPath: /apworlds
              readOnly: true
            - name: custom-worlds
              mountPath: /custom_worlds
        - name: reconcile
          image: *image
          command:
            - python
            - /scripts/reconcile.py
            - --rooms
            - /config/rooms.yaml
            - --seeds-dir
            - /seeds
            - --config_override
            - /secrets/secrets.yaml
          env:
            - name: PYTHONPATH
              value: /app
            - name: ROOM_OWNER
              valueFrom:
                secretKeyRef:
                  name: archipelago-secret
                  key: ROOM_OWNER
          securityContext: *securityContext
          volumeMounts: &volumeMounts
            - name: data
              mountPath: /data
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - name: config
              mountPath: /config
            - name: scripts
              mountPath: /scripts
            - name: secrets
              mountPath: /secrets
            - name: seeds
              mountPath: /seeds
              readOnly: true
            # Not subPath: the kubelet only refreshes whole-volume mounts on renewal.
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: custom-worlds
              mountPath: /app/custom_worlds
              readOnly: true
      containers:
        - name: webhost
          image: *image
          # WebHost.py, after removing the generate buttons and defaulting
          # apworld tutorials (scripts/webhost.py).
          command:
            - python
            - /scripts/webhost.py
            - --config_override
            - /secrets/secrets.yaml
          ports:
            - name: http
              containerPort: 8080
          securityContext: *securityContext
          volumeMounts: *volumeMounts
          # The room ports face the internet directly, so a flood or memory
          # blow-up must stay inside this pod instead of pressuring the node.
          # Hitting a limit restarts or evicts only this pod; saves are on the
          # PVC.
          resources:
            requests:
              cpu: 50m
              # ~490Mi with one small room and 7 apworlds loaded (~320Mi with none).
              # Each apworld is a Python module in the web process.
              memory: 512Mi
            limits:
              memory: 1Gi
              # ~40Mi in use: files WebHost generates at startup, plus room logs
              # in /app/logs, which grow with every connection attempt and are
              # unbounded. With no request, the request defaults to this.
              ephemeral-storage: 1Gi
          # Rooms take a few seconds to bind after the web UI is up.
          startupProbe:
            exec:
              command: &roomsAlive [python, /scripts/rooms_alive.py]
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: *roomsAlive
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: [python, /scripts/prestop.py]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ${APP}
        - name: config
          configMap:
            name: archipelago-config
        - name: scripts
          configMap:
            name: archipelago-scripts
        - name: secrets
          secret:
            secretName: archipelago-secret
            items:
              - key: secrets.yaml
                path: secrets.yaml
        - name: seeds
          nfs:
            server: ${SECRET_NFS_DOMAIN}
            path: /volume1/k8s/archipelago/seeds
            readOnly: true
        - name: tls
          secret:
            secretName: archipelago-game-tls
        # Written by tools/archipelago-apworlds: apworlds.yaml plus the files it lists.
        - name: apworlds
          nfs:
            server: ${SECRET_NFS_DOMAIN}
            path: /volume1/k8s/archipelago/apworlds
            readOnly: true
        - name: custom-worlds
          emptyDir:
            sizeLimit: 256Mi
