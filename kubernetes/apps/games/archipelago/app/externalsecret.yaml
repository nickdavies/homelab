---
# SECRET_KEY signs WebHost's session cookies. Its default is the pod hostname,
# and anyone who can forge a session can claim to be ROOM_OWNER and send
# admin commands to every room.
#
# ROOM_OWNER is the session id that owns every reconciled room. Visit
# /session/<ROOM_OWNER> once on the internal hostname to adopt it in a
# browser. It must be a version 4 UUID.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: archipelago-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: archipelago-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Passed to WebHost as --config_override, layered over config.yaml.
        secrets.yaml: |
          SECRET_KEY: "{{ .SECRET_KEY }}"
        ROOM_OWNER: "{{ .ROOM_OWNER }}"
  dataFrom:
    - extract:
        key: archipelago
