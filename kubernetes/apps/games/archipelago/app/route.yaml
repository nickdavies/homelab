---
# Public, read-only: trackers, room pages and patch downloads. There is no
# full-UI route: seeds come from rooms.yaml, and the rare admin task (adopting
# room ownership, reading room logs) goes through kubectl port-forward. See
# ../README.md.
#
# An allowlist rather than a blocklist because the dangerous routes are plain
# GETs: /new_room/<seed> creates a room on every hit, and /session/<id> hands
# any visitor the session (and so the rooms) of an owner id they know. Paths
# not matched here get Envoy's 404. The tracker and room pages refresh by
# reloading their own URL, so no /api/ route is needed.
#
# Cookies are stripped both ways. Browsers send Authelia's
# ${SECRET_PUBLIC_DOMAIN} session cookie to every subdomain, and these pages
# need no session, so a compromised pod sees no cookie to steal and can set
# none on sibling hostnames.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: archipelago
spec:
  hostnames:
    - "archipelago.${SECRET_PUBLIC_DOMAIN}"
  parentRefs:
    - name: external
      namespace: network
  rules:
    - matches:
        - path: {type: PathPrefix, value: /tracker/}
        - path: {type: PathPrefix, value: /generic_tracker/}
        - path: {type: PathPrefix, value: /sphere_tracker/}
        - path: {type: PathPrefix, value: /dl_patch/}
        - path: {type: PathPrefix, value: /slot_file/}
        - path: {type: PathPrefix, value: /static/}
        - path: {type: Exact, value: /favicon.ico}
        # POST /room/ sends server commands; WebHost checks the owner, but
        # nobody outside needs it.
        - path: {type: PathPrefix, value: /room/}
          method: GET
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [Cookie]
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            remove: [Set-Cookie]
      backendRefs:
        - kind: Service
          name: archipelago
          port: 8080
