---
# The primary room: the one game served at archipelago.<domain> / ap.<domain>
# itself. Switching it means changing two values, marked PRIMARY below: this
# Service's targetPort (the room's port in rooms.yaml) and the / redirect
# (the room's path, printed by reconcile; ../README.md shows how to derive it).
apiVersion: v1
kind: Service
metadata:
  name: archipelago-primary
spec:
  selector:
    app: archipelago
  ports:
    - name: game
      port: 38281
      targetPort: 38281 # PRIMARY: e2e-test's port
---
# Public, read-only: the primary room's game server, trackers, room pages and
# patch downloads. Admin tasks go through kubectl port-forward (../README.md).
#
# An allowlist rather than a blocklist because the dangerous routes are plain
# GETs: /new_room/<seed> creates a room on every hit, and /session/<id> hands
# any visitor the session (and so the rooms) of an owner id they know. Paths
# not matched here get Envoy's 404. The tracker and room pages refresh by
# reloading their own URL, so no /api/ route is needed.
#
# Cookies are stripped both ways. Browsers send any cookie scoped to the
# parent domain to this host, and these pages need no session, so a
# compromised pod sees no cookie to steal and can set none on sibling
# hostnames.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: archipelago
spec:
  hostnames:
    - "archipelago.${SECRET_PUBLIC_DOMAIN}"
    - "ap.${SECRET_PUBLIC_DOMAIN}"
  parentRefs:
    - name: external
      namespace: network
  rules:
    # Game clients: wss://ap.<domain>:443 opens a websocket on /. Exact path
    # plus a header match outranks the redirect below.
    - matches:
        - path: {type: Exact, value: /}
          headers:
            - type: RegularExpression
              name: Upgrade
              value: "(?i)websocket"
      filters: &stripCookies
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [Cookie]
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            remove: [Set-Cookie]
      backendRefs:
        - kind: Service
          name: archipelago-primary
          port: 38281
    # Browsers: / goes to the primary room's page, which links its trackers
    # and patch downloads. 302 because the primary changes.
    - matches:
        - path: {type: Exact, value: /}
      filters:
        - type: RequestRedirect
          requestRedirect:
            statusCode: 302
            path:
              type: ReplaceFullPath
              replaceFullPath: /room/pNf6yE1gUzyav46QNrsvJw # PRIMARY: e2e-test
    - matches:
        - path: {type: PathPrefix, value: /tracker/}
        - path: {type: PathPrefix, value: /generic_tracker/}
        - path: {type: PathPrefix, value: /sphere_tracker/}
        - path: {type: PathPrefix, value: /dl_patch/}
        - path: {type: PathPrefix, value: /slot_file/}
        - path: {type: PathPrefix, value: /static/}
        - path: {type: Exact, value: /favicon.ico}
        # POST /room/ sends server commands; WebHost checks the owner, but
        # nobody outside needs it.
        - path: {type: PathPrefix, value: /room/}
          method: GET
      filters: *stripCookies
      backendRefs:
        - kind: Service
          name: archipelago
          port: 8080
