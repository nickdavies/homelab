---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./statefulset.yaml
  - ./service.yaml
  - ./route.yaml
  - ./certificate.yaml
  - ./dnsendpoint.yaml
  - ./networkpolicy.yaml
  - ../../../../templates/volsync
# Hashed names: editing rooms.yaml, the config or a script renames the
# ConfigMap, which rolls the pod and re-runs reconcile.
configMapGenerator:
  - name: archipelago-config
    files:
      - config/config.yaml
      - config/rooms.yaml
  - name: archipelago-scripts
    files:
      - scripts/reconcile.py
      - scripts/rooms_alive.py
      - scripts/prestop.py
