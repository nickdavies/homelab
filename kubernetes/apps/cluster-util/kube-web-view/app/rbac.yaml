---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-web-view
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: kube-web-view
# Read access to everything except Secrets. The UI already hides Secret data,
# but the ServiceAccount token itself shouldn't be able to read it either.
#
# RBAC has no "all groups except core" form, so every non-core group is listed.
# A kind from a group added later shows as forbidden in the UI until its group
# is added here.
#
# No nonResourceURLs rule: API discovery is already granted to every
# authenticated identity by the built-in system:discovery role.
rules:
- apiGroups: ['']
  resources:
  - componentstatuses
  - configmaps
  - endpoints
  - events
  - limitranges
  - namespaces
  - nodes
  - persistentvolumeclaims
  - persistentvolumes
  - pods
  - podtemplates
  - replicationcontrollers
  - resourcequotas
  - serviceaccounts
  - services
  verbs: [list, get]
- apiGroups:
  - acme.cert-manager.io
  - admissionregistration.k8s.io
  - apiextensions.k8s.io
  - apiregistration.k8s.io
  - apps
  - autoscaling
  - barmancloud.cnpg.io
  - batch
  - ceph.rook.io
  - cert-manager.io
  - certificates.k8s.io
  - coordination.k8s.io
  - csi.ceph.io
  - deviceplugin.intel.com
  - discovery.k8s.io
  - dragonflydb.io
  - events.k8s.io
  - external-secrets.io
  - externaldns.k8s.io
  - flowcontrol.apiserver.k8s.io
  - fluxcd.controlplane.io
  - fpga.intel.com
  - gateway.envoyproxy.io
  - gateway.networking.k8s.io
  - gateway.networking.x-k8s.io
  - generators.external-secrets.io
  - groupsnapshot.storage.k8s.io
  - helm.toolkit.fluxcd.io
  - image.toolkit.fluxcd.io
  - k8s.cni.cncf.io
  - kustomize.toolkit.fluxcd.io
  - metallb.io
  - metrics.k8s.io
  - monitoring.coreos.com
  - networking.k8s.io
  - nfd.k8s-sigs.io
  - node.k8s.io
  - notification.toolkit.fluxcd.io
  - objectbucket.io
  - onepassword.com
  - openebs.io
  - policy
  - postgresql.cnpg.io
  - rbac.authorization.k8s.io
  - scheduling.k8s.io
  - snapshot.storage.k8s.io
  - source.toolkit.fluxcd.io
  - storage.k8s.io
  - tailscale.com
  - volsync.backube
  resources: ['*']
  verbs: [list, get]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: kube-web-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-web-view
subjects:
- kind: ServiceAccount
  name: kube-web-view
  namespace: cluster-util
