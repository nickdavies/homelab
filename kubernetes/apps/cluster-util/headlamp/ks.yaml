---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app headlamp
  namespace: flux-system
spec:
  targetNamespace: cluster-util
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/cluster-util/headlamp/app
  dependsOn:
    - name: gateway
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  interval: 30m
