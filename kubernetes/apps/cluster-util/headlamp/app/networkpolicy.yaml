# Only the internal gateway's Envoy proxy may reach Headlamp. Every visitor
# acts as its ServiceAccount, so Authelia on headlamp.internal
# (securitypolicy.yaml) only helps if nothing can go around the route.
#
# The break-glass port-forward (docs/break-glass-access.md) connects inside
# the pod, so it still works. Ingress only. Kubelet probes come from the node,
# which a NetworkPolicy never blocks.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headlamp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: headlamp
      app.kubernetes.io/instance: headlamp
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: internal
              gateway.envoyproxy.io/owning-gateway-namespace: network
      ports:
        - protocol: TCP
          port: 4466
