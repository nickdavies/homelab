# Only the internal gateway's Envoy proxy may reach Headlamp. Every visitor
# acts as its ServiceAccount, so Authelia on headlamp.internal
# (securitypolicy.yaml) only helps if nothing can go around the route.
#
# The break-glass port-forward (docs/break-glass-access.md) connects inside
# the pod, so it still works. Kubelet probes come from the node, which a
# NetworkPolicy never blocks.
#
# Egress is the API server only, so a compromised Headlamp holds a token it
# can't use against anything else. The kubernetes Service (10.96.0.1:443) is
# DNATed to the control-plane nodes before the policy matches, so the peer is
# the node subnet on 6443. Only the apiservers listen on 6443 there, and the
# subnet rather than each node's IP means control-plane changes need no edit
# here. The Prometheus plugin is disabled, and nothing else is dialled.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headlamp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: headlamp
      app.kubernetes.io/instance: headlamp
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: internal
              gateway.envoyproxy.io/owning-gateway-namespace: network
      ports:
        - protocol: TCP
          port: 4466
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - ipBlock: { cidr: 192.168.254.0/24 }
      ports:
        - { port: 6443, protocol: TCP }
