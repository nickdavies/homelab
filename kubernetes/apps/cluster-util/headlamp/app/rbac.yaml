---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: headlamp
# Every Headlamp user acts as this role (unsafeUseServiceAccountToken in
# helmrelease.yaml). Read and watch everything except Secrets and pod logs,
# which can carry credentials. The chart creates the ServiceAccount.
#
# RBAC has no "all groups except core" form, so every non-core group is listed.
# A kind from a group added later shows as forbidden in the UI until its group
# is added here.
#
# aquasecurity.github.io (Trivy) is left out on purpose: its
# ExposedSecretReports hold the secrets Trivy found in images, and the
# resources wildcard below would grant them. Add it only with an explicit
# resource list.
#
# No nonResourceURLs rule: API discovery is already granted to every
# authenticated identity by the built-in system:discovery role.
rules:
- apiGroups: ['']
  resources:
  - componentstatuses
  - configmaps
  - endpoints
  - events
  - limitranges
  - namespaces
  - nodes
  - persistentvolumeclaims
  - persistentvolumes
  - pods
  - podtemplates
  - replicationcontrollers
  - resourcequotas
  - serviceaccounts
  - services
  verbs: [list, get, watch]
- apiGroups:
  - acme.cert-manager.io
  - admissionregistration.k8s.io
  - apiextensions.k8s.io
  - apiregistration.k8s.io
  - apps
  - autoscaling
  - barmancloud.cnpg.io
  - batch
  - ceph.rook.io
  - cert-manager.io
  - certificates.k8s.io
  - coordination.k8s.io
  - csi.ceph.io
  - deviceplugin.intel.com
  - discovery.k8s.io
  - dragonflydb.io
  - events.k8s.io
  - external-secrets.io
  - externaldns.k8s.io
  - flowcontrol.apiserver.k8s.io
  - fluxcd.controlplane.io
  - fpga.intel.com
  - garage.rajsingh.info
  - gateway.envoyproxy.io
  - gateway.networking.k8s.io
  - gateway.networking.x-k8s.io
  - generators.external-secrets.io
  - groupsnapshot.storage.k8s.io
  - helm.toolkit.fluxcd.io
  - jetstream.nats.io
  - k8s.cni.cncf.io
  - kustomize.toolkit.fluxcd.io
  - metallb.io
  - metrics.k8s.io
  - monitoring.coreos.com
  - networking.k8s.io
  - nfd.k8s-sigs.io
  - node.k8s.io
  - notification.toolkit.fluxcd.io
  - objectbucket.io
  - onepassword.com
  - policy
  - postgresql.cnpg.io
  - rbac.authorization.k8s.io
  - resource.k8s.io
  - scheduling.k8s.io
  - snapshot.storage.k8s.io
  - source.toolkit.fluxcd.io
  - storage.k8s.io
  - tailscale.com
  - talos.dev
  - tuppr.home-operations.com
  - volsync.backube
  resources: ['*']
  verbs: [list, get, watch]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp
subjects:
- kind: ServiceAccount
  name: headlamp
  namespace: cluster-util
