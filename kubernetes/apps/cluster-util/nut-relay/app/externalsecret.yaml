---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nut-relay
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: nut-relay-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Inbound only: what clients present to our upsd. The entrypoint writes
        # it into upsd.users and upsmon.conf. The outbound leg to the NAS is
        # gated by that device's source-IP ACL, not by a credential -- see the
        # deployment for why the driver cannot supply one.
        API_PASSWORD: "{{ .RELAY_PASSWORD }}"
  dataFrom:
    - extract:
        key: nut-relay
