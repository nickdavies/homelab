---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nut-relay
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: nut-relay-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Inbound: what clients present to our upsd. The entrypoint writes it
        # into upsd.users and upsmon.conf.
        API_PASSWORD: "{{ .RELAY_PASSWORD }}"
        # Outbound: what the dummy-ups repeater presents to the NAS. Read by
        # libupsclient, selected by the authconf parameter in ups.conf.
        nutauth.conf: |
          [monuser@${SECRET_NAS_IP}]
            PASS = "{{ .NAS_PASSWORD }}"
  dataFrom:
    - extract:
        key: nut-relay
