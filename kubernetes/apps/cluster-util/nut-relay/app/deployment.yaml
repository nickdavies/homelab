---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nut-relay
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: nut-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nut-relay
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: nut-relay
              topologyKey: kubernetes.io/hostname
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nut-relay
          image: instantlinux/nut-upsd:latest
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          ports:
            - containerPort: 3493
              protocol: TCP
          # The image generates upsd.conf, upsd.users and upsmon.conf from these
          # at startup. NAME and MAXAGE are left at their defaults (ups, 15),
          # which is what this relay wants.
          #
          # API_PASSWORD is this relay's *inbound* password: it authenticates
          # clients connecting to our upsd, and the local upsmon connecting to
          # it over loopback. It is not used to reach the Synology. That leg is
          # ups.conf's `port = ups@<nas>` and needs no credentials, since NUT
          # only gates upsmon sessions and administrative commands, not the
          # variable reads a repeater performs.
          env:
            - name: API_USER
              value: monuser
            - name: SERVER
              value: secondary
            - name: API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nut-relay-secret
                  key: API_PASSWORD
          # ups.conf is supplied rather than generated because the repeater
          # needs repeater_disable_strict_start, which has no env equivalent.
          # /etc/nut/local is the entrypoint's documented copy-from location;
          # writing directly to /etc/nut/ups.conf fails as the mount is
          # read-only. Nesting it one level also keeps it clear of the
          # entrypoint's `chmod 640 /etc/nut/*`.
          volumeMounts:
            - name: nut-config
              mountPath: /etc/nut/local/ups.conf
              subPath: ups.conf
      volumes:
        - name: nut-config
          configMap:
            name: nut-relay-config
