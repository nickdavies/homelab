---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nut-relay
spec:
  replicas: 3
  # Three replicas are pinned to exactly three control-plane nodes under a
  # required anti-affinity, so there is no spare node to surge onto. The
  # defaults (maxSurge 25%, maxUnavailable 25%) deadlock at this replica
  # count: maxUnavailable floors to 0, so no old pod is retired, and a surge
  # pod has nowhere to schedule. Roll one node at a time instead.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nut-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nut-relay
    spec:
      # Pinning to the control-plane nodes is load-bearing, not a placement
      # preference. The NAS restricts NUT clients by source IP
      # (ups_acl = .9|.11|.12|.13) and .11/.12/.13 are those three nodes.
      # Flannel runs with --ip-masq, so pod egress is SNATed to the node IP and
      # the ACL still matches without hostNetwork. Allow these pods onto a
      # worker and the NAS will reject them.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: nut-relay
              topologyKey: kubernetes.io/hostname
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nut-relay
          image: instantlinux/nut-upsd:latest
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          ports:
            - containerPort: 3493
              protocol: TCP
          # Without this the pod reports healthy whenever the container is up,
          # because upsmon runs in the foreground and outlives a driver that
          # never connected. upsc exits non-zero in exactly that case
          # ("Error: Driver not connected"), so this reports whether the relay
          # can actually serve UPS data rather than whether a process exists.
          #
          # Readiness only, deliberately. The failure this catches is usually
          # the NAS being unreachable, and restarting the container does not
          # make it reachable -- a liveness probe would just thrash. Going
          # NotReady pulls the pod from the Service endpoints, so clients fail
          # closed instead of talking to a relay with no data.
          #
          # No specific variable is queried: which variables a repeated UPS
          # exposes depends on the remote, and naming one that is absent would
          # fail the probe permanently.
          readinessProbe:
            exec:
              command: ["/usr/bin/upsc", "ups@localhost:3493"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # The image generates upsd.conf, upsd.users and upsmon.conf from these
          # at startup. NAME and MAXAGE are left at their defaults (ups, 15),
          # which is what this relay wants.
          #
          # API_PASSWORD is this relay's *inbound* password: it authenticates
          # clients connecting to our upsd, and the local upsmon connecting to
          # it over loopback.
          #
          # There is deliberately no outbound credential. dummy-ups 2.8.5 has
          # no way to supply one -- the authconf parameter and nutauth.conf
          # exist only on NUT master, and setting authconf here is fatal:
          # "'authconf' is not a valid variable name for this driver". The NAS
          # gates access by source IP instead (see the affinity block).
          env:
            - name: API_USER
              value: monuser
            - name: SERVER
              value: secondary
            - name: API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nut-relay-secret
                  key: API_PASSWORD
          # ups.conf is supplied rather than generated because the repeater
          # needs repeater_disable_strict_start, which has no env equivalent.
          # /etc/nut/local is the entrypoint's documented copy-from location;
          # writing directly to /etc/nut/ups.conf fails as the mount is
          # read-only. Nesting it one level also keeps it clear of the
          # entrypoint's `chmod 640 /etc/nut/*`.
          volumeMounts:
            - name: nut-config
              mountPath: /etc/nut/local/ups.conf
              subPath: ups.conf
      volumes:
        - name: nut-config
          configMap:
            name: nut-relay-config
