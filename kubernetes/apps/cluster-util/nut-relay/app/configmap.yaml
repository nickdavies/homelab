---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nut-relay-config
data:
  # Copied to /etc/nut/ups.conf by the image entrypoint. Everything else
  # (upsd.conf, upsd.users, upsmon.conf) is generated from environment
  # variables on the deployment.
  ups.conf: |
    [ups]
      driver = dummy-ups
      port = ups@${SECRET_NAS_IP}
      desc = "Synology UPS relay"
      repeater_disable_strict_start = true
      authconf = /etc/nut-auth/nutauth.conf
