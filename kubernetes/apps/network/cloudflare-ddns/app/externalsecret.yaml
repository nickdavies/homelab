---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-ddns
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cloudflare-ddns-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        CLOUDFLARE_API_TOKEN: "{{ .CLOUDFLARE_API_TOKEN }}"
        CLOUDFLARE_RECORD_NAME: "{{ .CLOUDFLARE_RECORD_NAME }}"
  dataFrom:
    - extract:
        # CLOUDFLARE_API_TOKEN: API token scoped to DNS edit on this one zone,
        #   shared with external-dns and cert-manager
        # CLOUDFLARE_RECORD_NAME: The full name of your A record
        key: cloudflare-dns
