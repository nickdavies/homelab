---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-ddns
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cloudflare-ddns-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        CLOUDFLARE_API_TOKEN: "{{ .token }}"
        DOMAINS: "{{ .record }}"
  data:
    # Its own token (DNS edit on the zone), so it can be revoked without
    # touching external-dns or cert-manager, which share cloudflare-dns.
    - secretKey: token
      remoteRef:
        key: cloudflare-ddns
        property: API_TOKEN
    # The full name of the A record
    - secretKey: record
      remoteRef:
        key: cloudflare-dns
        property: CLOUDFLARE_RECORD_NAME
