apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 20m
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
    namespace: flux-system
  # The chart ships the Gateway API and Envoy Gateway CRDs in a subchart's
  # crds/ directory, which Helm installs once and never upgrades.
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    config:
      envoyGateway:
        # For games/archipelago/app/admin.yaml's cookie filter. This switch is
        # controller-wide: any EnvoyExtensionPolicy, on either gateway, can now
        # run Lua inside Envoy. There is no per-gateway switch (EnvoyProxy's
        # `lua` field only picks the validation mode).
        extensionApis:
          enableLua: true
        logging:
          level:
            default: debug
