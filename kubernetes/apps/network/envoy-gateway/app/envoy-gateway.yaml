apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 20m
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
    namespace: flux-system
  # The chart ships the Gateway API and Envoy Gateway CRDs in a subchart's
  # crds/ directory, which Helm installs once and never upgrades.
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    config:
      envoyGateway:
        logging:
          level:
            default: debug
