# Mirrors upstream config/prometheus-native, minus its RBAC for kube-prometheus's
# monitoring/prometheus-k8s: our Prometheus already has cluster-wide read on
# pods/services and GET /metrics. Metrics are served over HTTPS and authorize the
# caller's token via TokenReview + SubjectAccessReview.
---
apiVersion: v1
kind: Service
metadata:
  name: controller-monitor-service
  labels:
    name: controller-monitor-service
spec:
  clusterIP: None
  selector:
    component: controller
  ports:
    - name: metricshttps
      port: 9120
      targetPort: 9120
---
apiVersion: v1
kind: Service
metadata:
  name: speaker-monitor-service
  labels:
    name: speaker-monitor-service
spec:
  clusterIP: None
  selector:
    component: speaker
  ports:
    - name: metricshttps
      port: 9120
      targetPort: 9120
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: controller-monitor
spec:
  jobLabel: name
  selector:
    matchLabels:
      name: controller-monitor-service
  endpoints:
    - port: metricshttps
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        insecureSkipVerify: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: speaker-monitor
spec:
  jobLabel: name
  selector:
    matchLabels:
      name: speaker-monitor-service
  endpoints:
    - port: metricshttps
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        insecureSkipVerify: true
---
# Upstream chart's rules. gateway-ip-pool is excluded from exhaustion: it is
# sized exactly to the Gateways and is full by design.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: metallb
spec:
  groups:
    - name: metallb
      rules:
        - alert: MetalLBStaleConfig
          expr: metallb_k8s_client_config_stale_bool == 1
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: MetalLB is running on a stale configuration
            description: "{{ $labels.pod }} has a stale configuration: the latest config failed to load."
        - alert: MetalLBConfigNotLoaded
          expr: metallb_k8s_client_config_loaded_bool == 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: MetalLB configuration not loaded
            description: "{{ $labels.pod }} has not loaded any configuration."
        - alert: MetalLBAddressPoolExhausted
          expr: metallb_allocator_addresses_in_use_total{pool!="gateway-ip-pool"} >= on (pool) metallb_allocator_addresses_total
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: MetalLB address pool exhausted
            description: "Pool {{ $labels.pool }} has no free addresses; new LoadBalancer services will stay pending."
