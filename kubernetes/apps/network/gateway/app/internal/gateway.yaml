apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: internal
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
  labels:
    "homelab/gateway-type": internal
spec:
  gatewayClassName: internal
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: internal
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              internal-gateway-access: "true"
    - name: unifi-passthrough
      protocol: TLS
      port: 443
      hostname: "unifi.internal.${SECRET_DOMAIN}"
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              internal-gateway-access: "true"
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.internal.${SECRET_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: internal-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              internal-gateway-access: "true"
    # Gateway API treats `*.` as a suffix match, so the listener above already
    # routes two-label names like work.ai.internal. TLS does not: an X.509
    # wildcard covers exactly one label (RFC 6125), so internal-tls cannot
    # certify them and the handshake fails while the route reports Accepted.
    # Envoy selects the most specific SNI match, so these names terminate here.
    #
    # allowedRoutes MUST stay identical to the listener above: attachment is
    # evaluated per listener, and a route excluded from this one would silently
    # fall back to *.internal and its non-matching certificate.
    - name: https-ai
      protocol: HTTPS
      port: 443
      hostname: "*.ai.internal.${SECRET_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: ai-internal-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              internal-gateway-access: "true"
