---
# The only route on the plaintext listener. No hostnames, so it matches any
# name: http://<anything>.internal.<domain>/<path> gets a 301 to the same host
# and path over https.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: internal-https-redirect
spec:
  parentRefs:
    - name: internal
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
