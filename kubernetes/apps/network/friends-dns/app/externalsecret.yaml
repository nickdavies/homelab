---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# OAuth client from the *friends'* tailnet (not the main one), with the
# auth_keys write scope and tag:friends-dns. Used as an auth key; the query
# params stop the nodes from being ephemeral and skip device approval. It is
# only used on first login -- after that the node identity lives in the
# per-pod state Secrets (see rbac.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: friends-dns
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: friends-dns-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        TS_AUTHKEY: "{{ .CLIENT_SECRET }}?ephemeral=false&preauthorized=true"
  dataFrom:
    - extract:
        key: friends-dns-tailscale
