ports:
  dns: 1053
  http: 4000

log:
  level: info

prometheus:
  enable: true
  path: /metrics

upstreams:
  groups:
    default:
      - "8.8.8.8"
      - "8.8.4.4"
      - "1.1.1.1"

# Used to resolve upstream/blocklist hostnames without relying on the
# container's system resolver (does not depend on the conditional zone).
bootstrapDns:
  - upstream: tcp+udp:1.1.1.1
  - upstream: tcp+udp:8.8.8.8

# Resolve the internal zone locally via k8s-gateway so internal services keep
# working when the internet is down. Everything else uses the upstreams above.
conditional:
  fallbackUpstream: false
  mapping:
    internal.${SECRET_DOMAIN}: tcp+udp:192.168.254.200

# De-cloud the LG appliances: point them at rethink instead of LG. Both names
# are needed -- common.lgthinq.com is the bootstrap address the appliance ships
# with, and rethink.lan is the hostname rethink advertises and issues its
# self-signed cert for (it refuses a bare IP).
#
# customDNS is evaluated ahead of the conditional mapping above, and cluster
# workloads resolve via CoreDNS -> the node's 1.1.1.1, not through blocky, so
# this does not black-hole rethink's own path to LG during bridge mode.
#
# ap.<public domain> is the Archipelago game address. Publicly it points at
# the home IP, which the router forwards to this LoadBalancer IP
# (games/archipelago/app/service.yaml); on the LAN, go straight there instead
# of relying on hairpin NAT. Same hostname, so the room cert still matches.
customDNS:
  customTTL: 1h
  mapping:
    common.lgthinq.com: ${RETHINK_IP}
    rethink.lan: ${RETHINK_IP}
    ap.${SECRET_PUBLIC_DOMAIN}: 192.168.254.203

blocking:
  denylists:
    ads:
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
  clientGroupsBlock:
    default:
      - ads
  blockTTL: 1m
