---
# Approves kubelet serving-certificate CSRs (talos/patches/kubelet-certs.yaml
# turns on rotate-server-certificates). Without it, new kubelet serving certs
# stay pending: kubectl logs/exec and metrics-server's kubelet scrapes fail once
# the current certs expire, and on a fresh cluster until Flux installs this.
#
# The upstream standalone-install.yaml, the same manifest Talos applied as an
# extraManifest until it moved here, so Flux adopted the live objects without a
# rollout. Renovate bumps the URL in app/; merging upgrades it.
#
# No targetNamespace: the manifest puts its events RoleBinding in `default`.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kubelet-serving-cert-approver
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/kube-system/kubelet-serving-cert-approver/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
