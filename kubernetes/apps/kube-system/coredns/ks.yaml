---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app coredns
  namespace: flux-system
spec:
  targetNamespace: kube-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  path: ./kubernetes/apps/kube-system/coredns/app
  # Cluster DNS, which Flux itself needs to fetch from git: never prune it.
  # talos/bootstrap.sh applies the same manifests on a new cluster, before Flux.
  prune: false
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: homelab
    namespace: flux-system
  timeout: 5m
  wait: false
