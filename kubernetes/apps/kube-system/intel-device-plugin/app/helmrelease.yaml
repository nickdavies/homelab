---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugin-operator
spec:
  interval: 30m
  chart:
    spec:
      chart: intel-device-plugins-operator
      version: 0.37.1
      sourceRef:
        kind: HelmRepository
        name: intel
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  dependsOn:
    - name: node-feature-discovery
      namespace: kube-system
  # The operator runs every plugin DaemonSet as this ServiceAccount, and the
  # GPU plugin never calls the API. Neither the chart nor the GpuDevicePlugin
  # CR can turn the token off, so do it on the ServiceAccount.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ServiceAccount
              name: inteldeviceplugins-plugin
            patch: |-
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: inteldeviceplugins-plugin
              automountServiceAccountToken: false
