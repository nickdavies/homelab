---
apiVersion: v1
kind: Namespace
metadata:
  name: storage
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    volsync.backube/privileged-movers: "true"
  labels:
    internal-gateway-access: "true"
---
# Pods get an API token only if their spec asks for one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: storage
automountServiceAccountToken: false
