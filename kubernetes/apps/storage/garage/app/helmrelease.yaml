# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 5
  # Garage releases can migrate metadata one way (v2.5.0: "once a node is
  # upgraded, you must not downgrade it"), so a failed upgrade is left
  # failed for a person to fix rather than rolled back onto the new format.
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 0
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      garage:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Garage given an empty /meta generates a new node key and runs with
          # no layout, keys or buckets. Refuse instead, so a failed restore of
          # garage-meta stops here rather than being backed up over the good
          # metadata. See ../README.md for a first-ever install.
          require-meta:
            image:
              repository: public.ecr.aws/docker/library/busybox
              # renovate: depName=public.ecr.aws/docker/library/busybox datasource=docker
              tag: 1.37.0-musl@sha256:f6a95d611e0a8780fabdb2aec43e31275b2720dfefa3e41b16835bfc42454478
            command: ["/bin/sh", "-euc"]
            args:
              - |
                [ -s /meta/node_key ] && exit 0
                echo "/meta/node_key is missing: garage-meta was not restored" >&2
                exit 1
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
        containers:
          app:
            image:
              repository: dxflrs/garage
              # renovate: depName=dxflrs/garage datasource=docker
              tag: v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
            env:
              TZ: ${TIMEZONE}
            envFrom:
              - secretRef:
                  name: garage-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [100]
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: garage
        ports:
          s3:
            port: 3900
          admin:
            port: 3903
    persistence:
      config:
        type: configMap
        name: garage-configmap
        globalMounts:
          - path: /etc/garage.toml
            subPath: configuration.toml
      data:
        type: nfs
        server: ${SECRET_NFS_DOMAIN}
        path: /volume1/k8s/garage/data
        globalMounts:
          - path: /data
      meta:
        existingClaim: garage-meta
        globalMounts:
          - path: /meta
      metadata-snapshots:
        type: nfs
        server: ${SECRET_NFS_DOMAIN}
        path: /volume1/k8s/garage/metadata-snapshots
        globalMounts:
          - path: /metadata-snapshots
