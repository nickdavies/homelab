# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 5
      strategy: rollback
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      garage:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # One-shot copy of the metadata off NFS. The Recreate strategy stops
          # the old pod first, so LMDB is closed while this runs. The marker is
          # written last, so an interrupted copy is redone from scratch.
          copy-meta-from-nfs:
            image:
              repository: public.ecr.aws/docker/library/busybox
              tag: 1.37.0-musl@sha256:5cec3fc171c87218698e85a52af7087de727372aae264a787b8112901a5b0092
            command: ["/bin/sh", "-euc"]
            args:
              - |
                [ -e /meta/.copied-from-nfs ] && exit 0
                for f in /meta-nfs/*; do
                  n="$(basename "$f")"
                  [ "$n" = snapshots ] && continue
                  rm -rf "/meta/$n"
                  cp -R "$f" /meta/
                done
                touch /meta/.copied-from-nfs
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
        containers:
          app:
            image:
              repository: dxflrs/garage
              # renovate: depName=dxflrs/garage datasource=docker
              tag: v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
            env:
              TZ: ${TIMEZONE}
            envFrom:
              - secretRef:
                  name: garage-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [100]
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: garage
        ports:
          s3:
            port: 3900
          admin:
            port: 3903
    persistence:
      config:
        type: configMap
        name: garage-configmap
        globalMounts:
          - path: /etc/garage.toml
            subPath: configuration.toml
      data:
        type: nfs
        server: ${SECRET_NFS_DOMAIN}
        path: /volume1/k8s/garage/data
        globalMounts:
          - path: /data
      meta:
        existingClaim: garage-meta
        globalMounts:
          - path: /meta
      meta-nfs:
        type: nfs
        server: ${SECRET_NFS_DOMAIN}
        path: /volume1/k8s/garage/meta
        advancedMounts:
          garage:
            copy-meta-from-nfs:
              - path: /meta-nfs
                readOnly: true
      metadata-snapshots:
        type: nfs
        server: ${SECRET_NFS_DOMAIN}
        path: /volume1/k8s/garage/metadata-snapshots
        globalMounts:
          - path: /metadata-snapshots
