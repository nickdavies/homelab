# LMDB must not live on a network filesystem, so the DB is on ceph-block.
# Snapshots go to NFS so they survive losing the ceph volume.
metadata_dir = "/meta"
metadata_snapshots_dir = "/metadata-snapshots"
data_dir = "/data"
db_engine = "lmdb"
metadata_auto_snapshot_interval = "6h"

replication_factor = 1
compression_level = 2

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
