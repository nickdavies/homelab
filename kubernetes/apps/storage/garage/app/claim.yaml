---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-meta
spec:
  accessModes: ["ReadWriteOnce"]
  # Populated from the NAS backup on creation (./volsync.yaml).
  dataSourceRef:
    kind: ReplicationDestination
    apiGroup: volsync.backube
    name: garage-meta-dst
  resources:
    requests:
      storage: 2Gi
  storageClassName: ceph-block
