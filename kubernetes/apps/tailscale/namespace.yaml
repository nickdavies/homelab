---
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
# Pods get an API token only if their spec asks for one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: tailscale
automountServiceAccountToken: false
