---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-ops-mcp
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Pods get an API token only if their spec asks for one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: kube-ops-mcp
automountServiceAccountToken: false
