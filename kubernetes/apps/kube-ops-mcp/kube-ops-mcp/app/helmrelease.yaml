# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kube-ops-mcp
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
      strategy: rollback
  values:
    controllers:
      kube-ops-mcp:
        serviceAccount:
          name: *app
        pod:
          # The in-cluster kube client authenticates as the ServiceAccount.
          automountServiceAccountToken: true
        containers:
          app:
            image:
              repository: ghcr.io/nickdavies/kube-ops-mcp
              tag: main@sha256:50ca67e63f2d1937f0ca23e6b4d43d238afa09c74223e81c48ab92cca7959ae2
            env:
              ALLOWED_USERS: system:serviceaccount:workspaces:ws-homelab
              ALLOWED_HOSTS: kube-ops-mcp.kube-ops-mcp.svc.cluster.local,kube-ops-mcp.kube-ops-mcp.svc
              TOKEN_AUDIENCE: kube-ops-mcp
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 10
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8080
