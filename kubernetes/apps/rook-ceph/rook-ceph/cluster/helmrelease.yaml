---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: rook-ceph-cluster
      version: v1.20.8
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
        namespace: flux-system
  install:
    # This can take a long time to get fully setup
    timeout: 30m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  dependsOn:
    - name: rook-ceph-operator
      namespace: rook-ceph
    - name: snapshot-controller
      namespace: volsync-system
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true

    cephClusterSpec:
      # https://rook.io/docs/rook/v1.10/Storage-Configuration/Advanced/ceph-configuration/#custom-cephconf-settings
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "false" # quote
          device_failure_prediction_mode: none
        mon:
          # The mon store is small enough to sit in one SST, so the default
          # compact-on-trim rewrites all of it on every paxos trim (~85GB/day
          # per mon onto the control-plane root disks). RocksDB's background
          # compaction is enough.
          mon_compact_on_trim: "false" # quote
      mgr:
        modules:
          # Its bundled model unpickles against sklearn.svm.classes, which the
          # mgr image's scikit-learn no longer has, so every prediction run
          # crashes the module. Rook only acts on listed modules, so it stays
          # listed as disabled rather than removed.
          - name: diskprediction_local
            enabled: false
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          - name: rook
            enabled: true
      network:
        provider: host
        connections:
          requireMsgr2: true
      resources:
        mgr:
          requests:
            memory: 512Mi
            cpu: 0m
          limits:
            memory: 2Gi
        mon:
          requests:
            memory: 512Mi
            cpu: 0m
          limits:
            memory: 4Gi
        prepareosd:
          requests:
            memory: 50Mi
            cpu: 0m
        osd:
          requests:
            memory: 2Gi
            cpu: 0m
          limits:
            memory: 6Gi
        mgr-sidecar:
          requests:
            memory: 128Mi
            cpu: 0m
          limits:
            memory: 256Mi
        crashcollector:
          requests:
            memory: 60Mi
            cpu: 0m
          limits:
            memory: 60Mi
        logcollector:
          requests:
            memory: 100Mi
            cpu: 0m
          limits:
            memory: 1Gi
        cleanup:
          requests:
            memory: 100Mi
            cpu: 0m
          limits:
            memory: 1Gi
        exporter:
          requests:
            memory: 50Mi
            cpu: 0m
          limits:
            memory: 128Mi
      # https://rook.io/docs/rook/latest/Storage-Configuration/Advanced/cephx-key-rotation/
      # Bump keyGeneration to rotate daemon keys (mon/mgr/osd/mds/rgw). Rook
      # picks aes256k for them. CSI keys stay aes: aes256k kernel mounts need
      # Linux 7.0+.
      security:
        cephx:
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
      healthCheck:
        # These stay raised while CSI keys are aes. Unmute once the nodes run
        # Linux 7.0+ and CSI keys are rotated to aes256k.
        muteHealthWarning:
          AUTH_INSECURE_CLIENT_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_KEYS_ALLOWED:
            policy: mute
          AUTH_INSECURE_KEYS_CREATABLE:
            policy: mute
      crashCollector:
        disable: false
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://prometheus-operated.observability.svc.cluster.local:9090
      # Explicit per-node devices, workers only: control-plane nodes carry no
      # OSDs. NVMe enumeration order differs between identical nodes (node-6
      # boots from nvme1n1, node-7 from nvme0n1), so disks are pinned by
      # /dev/disk/by-id.
      storage:
        useAllNodes: false
        useAllDevices: false
        config:
          osdsPerDevice: "1"
        nodes:
          - name: k8s-node-5
            devices:
              - name: /dev/disk/by-id/ata-Samsung_SSD_850_EVO_1TB_S2RENX0HA05085J
          - name: k8s-node-6
            devices:
              - name: /dev/disk/by-id/nvme-CT1000P3PSSD8_25164F898B7D
          - name: k8s-node-7
            devices:
              - name: /dev/disk/by-id/nvme-CT1000P3PSSD8_25014DD97491
          - name: k8s-node-8
            devices:
              - name: /dev/disk/by-id/nvme-Samsung_SSD_990_PRO_2TB_S7L9NJ0L815368F
      placement:
        mgr: &placement
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: Exists
        mon: *placement
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          parameters:
            imageFormat: "2"
            imageFeatures: layering
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete
    cephFileSystems:
      - name: &cephFileSystemName ceph-filesystem
        spec:
          metadataPool:
            replicated:
              size: 3
          dataPools:
            - failureDomain: host
              replicated:
                size: 3
              name: data0
          metadataServer:
            activeCount: 1
            activeStandby: true
            resources:
              requests:
                memory: 1Gi
                cpu: 0m
              limits:
                memory: 4Gi
            placement:
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: ceph-mds
                      app.kubernetes.io/part-of: *cephFileSystemName
        storageClass:
          enabled: true
          isDefault: false
          name: ceph-filesystem
          pool: data0
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          parameters:
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
            csi.storage.k8s.io/fstype: ext4
    cephFileSystemVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-filesystem
      isDefault: false
      deletionPolicy: Delete
    cephObjectStores:
      - name: ceph-objectstore
        spec:
          metadataPool:
            failureDomain: host
            replicated:
              size: 3
          dataPool:
            failureDomain: host
            # erasureCoded:
            #   dataChunks: 2
            #   codingChunks: 1
            replicated:
              size: 3
          preservePoolsOnDelete: true
          gateway:
            port: 80
            resources:
              requests:
                memory: 1Gi
                cpu: 0m
              limits:
                memory: 2Gi
            instances: 2
            priorityClassName: system-cluster-critical
          healthCheck:
            bucket:
              interval: 60s
        storageClass:
          enabled: true
          name: ceph-bucket
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
          parameters:
            region: us-east-1
