# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lldap
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      # The entrypoint drops to uid/gid 1000 (gosu), so group-own the
      # root-owned Postgres client key (mode 0440) with that gid. sqlx reads
      # it through rustls, which doesn't check key permissions. The only
      # other volume is an emptyDir.
      securityContext:
        fsGroup: 1000
    controllers:
      lldap:
        replicas: 2
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            image:
              repository: ghcr.io/lldap/lldap
              tag: v0.6.3@sha256:2a8454b668c1aba7157e832eab0e242e1e7eb5fb7591d7e7774ba05286511ca8
            envFrom:
              - secretRef:
                  name: lldap-secret
            env:
              TZ: ${TIMEZONE}
              # Client-certificate login (templates/postgres-client). The
              # server isn't verified because its CA shares a Secret with the
              # CA private key.
              LLDAP_DATABASE_URL: postgres://lldap@postgres-rw.database.svc.cluster.local/lldap?sslmode=require&sslcert=/postgres/tls.crt&sslkey=/postgres/tls.key
              LLDAP_HTTP_PORT: &port 80
              LLDAP_HTTP_URL: https://lldap.internal.${SECRET_DOMAIN}
              LLDAP_LDAP_PORT: &ldapPort 389
              LLDAP_LDAP_BASE_DN: dc=home,dc=arpa
            resources:
              requests:
                cpu: 100m
                memory: 100Mi
              limits:
                memory: 500Mi
    service:
      app:
        controller: lldap
        ports:
          http:
            port: *port
          ldap:
            enabled: true
            port: *ldapPort
    persistence:
      data:
        enabled: true
        type: emptyDir
      postgres-client-cert:
        type: secret
        name: lldap-postgres-client-cert
        defaultMode: 0440
        advancedMounts:
          lldap:
            app:
              - path: /postgres
                readOnly: true
