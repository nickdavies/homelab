---
# Grants cluster-admin to Authelia's `admin` group, as seen by the
# kube-apiserver once it is configured with --oidc-groups-prefix=oidc:.
#
# Deliberately a binding to the built-in cluster-admin role rather than a
# bespoke one: this replaces day-to-day use of the system:masters client
# certificate, so narrowing it here would only push people back to the
# break-glass credential, which is the thing with no audit trail and no expiry.
#
# Inert until the apiserver is given its --oidc-* flags: until then nothing
# can present a token that lands in this group.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc:admin
