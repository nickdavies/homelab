---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: authelia-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # App
        AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD: "{{ .LLDAP_LDAP_USER_PASS }}"
        AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET: "{{ .AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET }}"
        AUTHELIA_IDENTITY_PROVIDERS_OIDC_ISSUER_PRIVATE_KEY: "{{ .AUTHELIA_IDENTITY_PROVIDERS_OIDC_ISSUER_PRIVATE_KEY }}"
        AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: "{{ .AUTHELIA_JWT_SECRET }}"
        AUTHELIA_SESSION_SECRET: "{{ .AUTHELIA_SESSION_SECRET }}"
        AUTHELIA_STORAGE_ENCRYPTION_KEY: "{{ .AUTHELIA_STORAGE_ENCRYPTION_KEY }}"

        # oauth secrets
        GRAFANA_OAUTH_CLIENT_SECRET_HASH: "{{ .GRAFANA_OAUTH_CLIENT_SECRET_HASH }}"
        IMMICH_OAUTH_CLIENT_SECRET_HASH: "{{ .IMMICH_OAUTH_CLIENT_SECRET_HASH }}"
        PAPERLESS_OAUTH_CLIENT_SECRET_HASH: "{{ .PAPERLESS_OAUTH_CLIENT_SECRET_HASH }}"
        ACTUAL_OAUTH_CLIENT_SECRET_HASH: "{{ .ACTUAL_OAUTH_CLIENT_SECRET_HASH }}"
        CLAUDE_NOTIFY_PERSONAL_OAUTH_CLIENT_SECRET_HASH: "{{ .CLAUDE_NOTIFY_PERSONAL_OAUTH_CLIENT_SECRET_HASH }}"
        CLAUDE_NOTIFY_WORK_OAUTH_CLIENT_SECRET_HASH: "{{ .CLAUDE_NOTIFY_WORK_OAUTH_CLIENT_SECRET_HASH }}"
  dataFrom:
    - extract:
        key: authelia
    - extract:
        key: lldap
