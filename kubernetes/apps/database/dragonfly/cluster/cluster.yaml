---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/dragonflydb.io/dragonfly_v1alpha1.json
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly
spec:
  image: ghcr.io/dragonflydb/dragonfly:v2.1.0@sha256:94891bb22ce2fb0f7a5a3ff1bb3b2fbbc5830e2523293e47723d87fa3e5b1184
  # A replica lets the operator move the master with REPLTAKEOVER on rollouts
  # and promote it on master loss, so restarts keep the in-memory state.
  replicas: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: dragonfly
  # Dragonfly refuses a maxmemory below 256MiB per thread. That is a cap on
  # its dataset, not an allocation, so the request is sized to real usage
  # (~60Mi per pod) with headroom. The limit is a hard backstop at the same
  # size: process overhead means a dataset near maxmemory is OOM-killed
  # before Dragonfly's own cap applies.
  args:
    - --maxmemory=512Mi
    - --proactor_threads=2
    - --cluster_mode=emulated
    - --default_lua_flags=allow-undeclared-keys
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
