---
# Only Dragonfly's known clients may reach it. Neither port has a password:
# 6379 has no requirepass, and the operator starts 9999 with --admin_nopass.
# Anything that connects can read, rewrite or FLUSHALL every database.
# Authelia has its own instance (../authelia).
#
#   6379   data      Immich, Paperless
#   9999   admin     Prometheus (PodMonitor), the operator, replication
#
# Ingress only. The probes exec healthcheck.sh inside the container, so they
# never cross the pod network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dragonfly
spec:
  podSelector:
    matchLabels:
      app: dragonfly
  policyTypes: [Ingress]
  ingress:
    # Immich's machine-learning pod also gets REDIS_HOSTNAME from the shared
    # ConfigMap but never connects; only immich-server runs the job queues.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media
          podSelector:
            matchLabels:
              app.kubernetes.io/name: immich-server
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: productivity
          podSelector:
            matchLabels:
              app.kubernetes.io/name: paperless-ngx
      ports:
        - { port: 6379, protocol: TCP }
    # The PodMonitor scrapes /metrics on the admin port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - { port: 9999, protocol: TCP }
    # The operator issues REPLICAOF / REPLTAKEOVER to each pod's admin port.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dragonfly-operator
      ports:
        - { port: 9999, protocol: TCP }
    # Replicas dial the master's admin port. Which pod is master moves on
    # failover, so every Dragonfly pod may reach every other on any port.
    - from:
        - podSelector:
            matchLabels:
              app: dragonfly
