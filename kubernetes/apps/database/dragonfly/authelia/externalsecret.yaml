---
# The same 1Password field feeds Authelia's authelia-secret in `security`.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonfly-authelia
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dragonfly-authelia-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: authelia
        property: AUTHELIA_SESSION_REDIS_PASSWORD
