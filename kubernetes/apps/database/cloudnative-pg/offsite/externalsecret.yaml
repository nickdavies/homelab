---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudnative-pg-offsite
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cloudnative-pg-offsite-secret
    template:
      engineVersion: v2
      data:
        RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID: "{{ .GARAGE_ACCESS_KEY_ID }}"
        RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY: "{{ .GARAGE_SECRET_ACCESS_KEY }}"
        RCLONE_CONFIG_R2_ENDPOINT: "{{ .R2_ENDPOINT }}"
        RCLONE_CONFIG_R2_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
        RCLONE_CONFIG_OFFSITE_REMOTE: "r2:{{ .R2_BUCKET }}"
        RCLONE_CONFIG_OFFSITE_PASSWORD: "{{ .CRYPT_PASSWORD_OBSCURED }}"
        RCLONE_CONFIG_OFFSITE_PASSWORD2: "{{ .CRYPT_SALT_OBSCURED }}"
  dataFrom:
    - extract:
        # GARAGE_ACCESS_KEY_ID / GARAGE_SECRET_ACCESS_KEY: read-only garage key
        #   (garage bucket allow --read) on cloudnative-pg and cloudnative-pg-immich
        # R2_ENDPOINT: https://<account>.r2.cloudflarestorage.com
        # R2_BUCKET: the dedicated offsite bucket
        # CRYPT_PASSWORD_OBSCURED / CRYPT_SALT_OBSCURED: rclone crypt password
        #   and password2, stored as `rclone obscure` output because that is
        #   what rclone config takes (`rclone reveal` recovers them). The
        #   offsite copy is unreadable without them.
        key: cloudnative-pg-offsite
    - extract:
        # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, shared with VolSync's R2 copies
        key: cloudflare-r2
