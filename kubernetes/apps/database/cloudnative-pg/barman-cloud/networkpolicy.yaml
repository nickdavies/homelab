---
# The barman-cloud plugin's operator-side server. The CNPG operator calls it
# over mTLS; the backup and WAL work itself runs in the sidecar it injects
# into each instance pod, so this pod never touches the object stores.
#
#   ingress 9090   the CNPG operator
#   egress  6443   the API server (ObjectStore and Secret reads), via the
#                  node subnet like the operator's policy
#
# Kubelet probes (8081) come from the node, which a NetworkPolicy never
# blocks.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: barman-cloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: barman-cloud
      app.kubernetes.io/controller: barman-cloud
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - { port: 9090, protocol: TCP }
  egress:
    - to:
        - ipBlock: { cidr: 192.168.254.0/24 }
      ports:
        - { port: 6443, protocol: TCP }
