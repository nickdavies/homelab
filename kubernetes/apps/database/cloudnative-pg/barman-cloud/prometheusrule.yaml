---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: barman-cloud
spec:
  groups:
    - name: barman-cloud
      rules:
        # Base backups run @daily. 26h gives a run two hours to finish before
        # alerting, rather than waiting for the next night to also fail.
        # cnpg_collector_last_available_backup_timestamp is always 0 under the
        # plugin; the plugin exports its own series.
        - alert: PostgresBackupStale
          expr: time() - max by (namespace, job) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp) > 26 * 3600
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: Postgres base backup is stale
            description: "{{ $labels.job }} last completed a base backup {{ $value | humanizeDuration }} ago."
        # Without this, a cluster whose plugin stops exporting silently drops
        # out of PostgresBackupStale. Also fires for a cluster with no backups.
        - alert: PostgresBackupMetricsMissing
          expr: count by (namespace, job) (cnpg_collector_up) unless on (namespace, job) count by (namespace, job) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: Postgres cluster has no backup metrics
            description: "{{ $labels.job }} exports no barman-cloud backup metrics, so its backup age is not being checked."
        # Point-in-time recovery between base backups depends on WAL archiving.
        # An idle primary archives nothing, so compare the last failure to the
        # last success instead of alerting on time since last archival.
        - alert: PostgresWALArchivingFailing
          expr: cnpg_pg_stat_archiver_last_failed_time > cnpg_pg_stat_archiver_last_archived_time
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: Postgres WAL archiving is failing
            description: "{{ $labels.job }} ({{ $labels.pod }}) failed its most recent WAL archive attempt."
