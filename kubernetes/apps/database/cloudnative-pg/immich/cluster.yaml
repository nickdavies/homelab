---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 3
  imageName: "ghcr.io/immich-app/postgres:18-vectorchord0.5.3"
  primaryUpdateStrategy: unsupervised
  storage:
    size: 40Gi
    storageClass: openebs-hostpath
  # postgres has no password; Immich connects as the immich superuser by
  # client certificate (./client.yaml).
  enableSuperuserAccess: false
  # Immich PG expects this
  postgresUID: 999
  postgresGID: 999
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
    parameters:
      max_connections: "600"
      shared_buffers: 512MB
    # The immich role (./client.yaml) logs in by client certificate, to every
    # database because Immich's backups run pg_dumpall. CNPG renders this
    # before its default `host all all all scram-sha-256`, so the role's TLS
    # logins require the certificate and other roles are unaffected.
    #
    # `app` is the owner CNPG's initdb defaults create. CNPG keeps
    # re-applying its password from the immich-app Secret, so the role can't
    # be dropped; nothing uses it, so refuse its network logins instead.
    pg_hba:
      - hostssl all immich all cert
      - host all app all reject
  managed:
    roles:
      # Created by postgres-init, which required a user that Immich never
      # used. Owns nothing since the immich role took the database.
      - name: dummyuser
        ensure: absent
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
  # https://github.com/cloudnative-pg/cloudnative-pg/issues/2570
  enablePDB: false
  resources:
    requests:
      cpu: 250m
    limits:
      memory: 3Gi
  monitoring:
    enablePodMonitor: true
    podMonitorMetricRelabelings:
      - { sourceLabels: ["cluster"], targetLabel: cnpg_cluster, action: replace }
      - { regex: cluster, action: labeldrop }
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters: &parameters
        barmanObjectName: garage-immich
        serverName: immich-v1
#   bootstrap:
#     recovery:
#       source: source
  externalClusters:
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters: *parameters
