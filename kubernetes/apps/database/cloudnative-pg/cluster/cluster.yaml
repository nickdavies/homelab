---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 3
  # CNPG only publishes new releases under <version>-<type>-<debian> tags; bare
  # version tags stopped at 18.6. "standard" rather than "system": WAL archiving
  # goes through the barman-cloud plugin, so the in-image barman isn't needed.
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:1abcfd1cac6d53cda5185706819aab36d66a4ed88e99fc2ae44ab0826aa99f00
  primaryUpdateStrategy: unsupervised
  storage:
    size: 40Gi
    storageClass: openebs-hostpath
  # postgres has no password; apps connect by client certificate as their
  # own roles (./cert-auth.yaml, templates/postgres-client).
  enableSuperuserAccess: false
  postgresql:
    parameters:
      max_connections: "600"
      shared_buffers: 512MB
    # Members of cert_auth (./cert-auth.yaml) must present a client
    # certificate on TLS logins. CNPG renders this between its fixed rules and
    # the default `host all all all scram-sha-256`, so a member that keeps its
    # password (mid-migration) can still log in without TLS, and roles outside
    # the group are unaffected whatever their sslmode.
    pg_hba:
      - hostssl all +cert_auth all cert
    #shared_preload_libraries:
    #  - "vectors.so"
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
  # https://github.com/cloudnative-pg/cloudnative-pg/issues/2570
  enablePDB: false
  # A smart shutdown waits for clients to disconnect, and pooled app
  # connections never do, so a drained primary waits out the whole 180s default
  # before CNPG promotes a replica. Fall through to a fast shutdown quickly.
  smartShutdownTimeout: 15
  resources:
    requests:
      cpu: 250m
    limits:
      memory: 3Gi
  monitoring:
    enablePodMonitor: true
    podMonitorMetricRelabelings:
      - { sourceLabels: ["cluster"], targetLabel: cnpg_cluster, action: replace }
      - { regex: cluster, action: labeldrop }
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters: &parameters
        barmanObjectName: garage
        serverName: postgres
  bootstrap:
    recovery:
      source: source
  externalClusters:
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters: *parameters
