---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app garage-operator
  namespace: flux-system
spec:
  targetNamespace: garage-operator
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    # The chart's webhook serving cert comes from a cert-manager Issuer.
    - name: cert-manager
  path: ./kubernetes/apps/garage-operator/garage-operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
