apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  TIMEZONE: "America/Denver"
  # rethink's macvlan address on the NoT VLAN (eth0.30). Lives here rather than
  # in the app because blocky has to resolve the LG hostnames to it, and the two
  # must not drift. Static NoT pod addresses sit below the .100-.200 DHCP
  # pool: home-assistant .9, rethink .10, Frigate .50, xcel-meter .51; .11-.49
  # stays free to match the machines' numbering on the node network. Gateway is
  # .1.
  RETHINK_IP: "192.168.30.10"
