apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: envoy-gateway
spec:
  interval: 1h
  url: oci://docker.io/envoyproxy/gateway-helm
  # An exact tag, not a semver range: Renovate only proposes updates for exact
  # tags, so a range silently stops at its upper bound.
  ref:
    # The digest wins over the tag; the tag is for humans and Renovate.
    tag: 1.10.0
    digest: sha256:62fe8cca72a8770bb33900dd5c0990011ab98f2d6f4420c449ce44b1ca4eebe6
