---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: garage-operator
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # The digest wins over the tag; the tag is for humans and Renovate.
    tag: 0.8.3
    digest: sha256:b5ce1bd3fa0bca8fe6c872732859e2e00f6a9ade0b850efba54ab232b85ececf
  url: oci://ghcr.io/rajsinghtech/charts/garage-operator
  verify:
    provider: cosign
    # Upstream publishes charts only from v* tags, so branch builds are rejected.
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/rajsinghtech/garage-operator/\.github/workflows/helm\.yml@refs/tags/v.*$
