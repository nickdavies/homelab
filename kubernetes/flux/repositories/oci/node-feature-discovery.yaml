---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: node-feature-discovery
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # The digest wins over the tag; the tag is for humans and Renovate.
    tag: 0.20.1
    digest: sha256:5c4df0919041454a3a2095965e3ada6bb514095731921f3055aa539669e79e54
  url: oci://registry.k8s.io/nfd/charts/node-feature-discovery
  verify:
    provider: cosign
    # Kubernetes release tooling signs with more than one service account
    # (krel-trust, promoter-summaries), so match the project, not one account.
    matchOIDCIdentity:
      - issuer: ^https://accounts\.google\.com$
        subject: ^[a-z-]+@k8s-releng-prod\.iam\.gserviceaccount\.com$
