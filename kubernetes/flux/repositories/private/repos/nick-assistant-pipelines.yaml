apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: deploy-key-nick-assistant-pipelines
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: deploy-key-nick-assistant-pipelines
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: deploy_key_nick_assistant_pipelines
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: nick-assistant-pipelines
spec:
  interval: 5m0s
  provider: generic
  url: ssh://git@github.com/nickdavies/nick-assistant-pipelines.git
  ref:
    branch: main
  secretRef:
    name: deploy-key-nick-assistant-pipelines
