[package]
name = "talos-session"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "talos-session"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
clap = { version = "4.0", features = ["derive", "env"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
x509-parser = "0.18"
