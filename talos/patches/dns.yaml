---
machine:
  network:
    disableSearchDomain: true
    nameservers:
      - 1.1.1.1
      - 1.0.0.1
  features:
    hostDNS:
      enabled: true
      resolveMemberNames: true
      forwardKubeDNSToHost: false
cluster:
  # CoreDNS is Flux's (kubernetes/apps/kube-system/coredns); talos/bootstrap.sh
  # installs it on a new cluster. Talos' copy would replace the Corefile on
  # every upgrade-k8s.
  coreDNS:
    disabled: true
