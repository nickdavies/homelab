---
# Lifetime of every kubeconfig `talosctl kubeconfig` hands out (default 1y).
# The Kubeconfig RPC takes no arguments, so this is the only lifetime control;
# talos-session refuses anything longer than its KUBECONFIG_TTL, so keep the
# two in step. Machined's own internal kubeconfigs don't read this.
cluster:
  adminKubeconfig:
    certLifetime: 4h
